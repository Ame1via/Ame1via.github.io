<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sanctum 3D - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --paper: #f2f0eb;
      --dim: #9a958b;
      --blood: #5b1417;
      --gold: #b88b4a;
      --set-image: url("/assets/sanctum/layers/backgrounds/background-01.png");
      --yaw: 0deg;
      --pitch: -6deg;
      --zoom: 1;
      --mx: 50%;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #070605;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    .scene {
      position: fixed;
      inset: 0;
      perspective: 980px;
      perspective-origin: var(--mx) 48%;
      background:
        radial-gradient(circle at var(--mx) 36%, rgba(242, 240, 235, 0.13), transparent 24%),
        radial-gradient(circle at 70% 56%, rgba(91, 20, 23, 0.3), transparent 32%),
        linear-gradient(180deg, #14100d, #050505 66%);
      cursor: grab;
      user-select: none;
    }

    .scene:active { cursor: grabbing; }

    .stage {
      position: absolute;
      left: 50%;
      top: 53%;
      width: min(86vw, 1220px);
      aspect-ratio: 16 / 9;
      transform-style: preserve-3d;
      transform:
        translate(-50%, -50%)
        scale(var(--zoom))
        rotateX(var(--pitch))
        rotateY(var(--yaw));
      transition: transform 80ms ease-out;
    }

    .panel,
    .rib,
    .column,
    .lamp,
    .tracery {
      position: absolute;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .panel {
      inset: 0;
      overflow: hidden;
      border: 1px solid rgba(242, 240, 235, 0.12);
      background-image:
        linear-gradient(180deg, rgba(242, 240, 235, 0.08), rgba(7, 6, 5, 0.6)),
        var(--set-image);
      background-position: center;
      background-size: cover;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.7), 0 0 48px rgba(0, 0, 0, 0.72);
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(184, 139, 74, 0.11) 1px, transparent 1px),
        linear-gradient(0deg, rgba(242, 240, 235, 0.07) 1px, transparent 1px),
        radial-gradient(ellipse at center, transparent 34%, rgba(7, 6, 5, 0.32) 82%);
      background-size: 9% 100%, 100% 11%, auto;
      mix-blend-mode: screen;
      opacity: 0.48;
    }

    .back-wall {
      transform: translateZ(-430px);
      filter: saturate(1.04) brightness(0.96) contrast(1.05);
    }

    .floor {
      top: 68%;
      height: 70%;
      transform-origin: 50% 0;
      transform: rotateX(78deg) translateZ(-10px);
      filter: saturate(1.04) brightness(0.7) contrast(1.14);
      background-position: center 78%;
    }

    .floor::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(242, 240, 235, 0.12), rgba(7, 6, 5, 0.5)),
        linear-gradient(90deg, transparent, rgba(184, 139, 74, 0.16), transparent);
      mix-blend-mode: screen;
    }

    .ceiling {
      top: -44%;
      height: 54%;
      transform-origin: 50% 100%;
      transform: rotateX(-72deg) translateZ(-22px);
      filter: saturate(0.86) brightness(0.55) contrast(1.16);
      background-position: center 6%;
    }

    .left-wall,
    .right-wall {
      width: 48%;
      height: 100%;
      filter: saturate(0.95) brightness(0.62) contrast(1.12);
      background-size: 190% 100%;
    }

    .left-wall {
      left: -24%;
      transform-origin: 100% 50%;
      transform: rotateY(64deg) translateZ(-12px);
      background-position: left center;
    }

    .right-wall {
      right: -24%;
      transform-origin: 0 50%;
      transform: rotateY(-64deg) translateZ(-12px);
      background-position: right center;
    }

    .arch-frame {
      position: absolute;
      inset: 4% 7% 5%;
      transform: translateZ(-110px);
      border: clamp(8px, 1.2vw, 15px) solid rgba(11, 8, 7, 0.82);
      border-bottom-width: clamp(14px, 2vw, 28px);
      border-radius: 48% 48% 2% 2% / 34% 34% 2% 2%;
      box-shadow:
        inset 0 0 0 1px rgba(184, 139, 74, 0.26),
        inset 0 0 52px rgba(184, 139, 74, 0.1),
        0 0 36px rgba(0, 0, 0, 0.78);
      pointer-events: none;
    }

    .arch-frame::before,
    .arch-frame::after {
      content: "";
      position: absolute;
      top: 6%;
      bottom: -3%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(184, 139, 74, 0.68), transparent);
      box-shadow: 0 0 18px rgba(184, 139, 74, 0.34);
    }

    .arch-frame::before { left: 31%; }
    .arch-frame::after { right: 31%; }

    .rib {
      left: 50%;
      top: 8%;
      width: 1px;
      height: 86%;
      background: linear-gradient(180deg, transparent, rgba(242, 240, 235, 0.48), transparent);
      box-shadow: 0 0 14px rgba(184, 139, 74, 0.24);
      opacity: 0.5;
      transform-origin: 50% 100%;
    }

    .column {
      bottom: 13%;
      width: clamp(14px, 2vw, 26px);
      height: 62%;
      border-radius: 999px 999px 5px 5px;
      background:
        linear-gradient(90deg, rgba(242, 240, 235, 0.08), rgba(7, 6, 5, 0.82), rgba(184, 139, 74, 0.22)),
        var(--set-image);
      background-size: 900% 180%;
      background-position: center;
      border: 1px solid rgba(184, 139, 74, 0.24);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.54);
      transform: translateZ(-42px);
    }

    .column::before,
    .column::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 190%;
      height: 10px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, rgba(7, 6, 5, 0.8), rgba(184, 139, 74, 0.44), rgba(7, 6, 5, 0.8));
      border: 1px solid rgba(184, 139, 74, 0.22);
    }

    .column::before { top: -8px; }
    .column::after { bottom: -8px; }

    .lamp {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(225, 34, 45, 0.95);
      box-shadow:
        0 0 12px rgba(225, 34, 45, 0.96),
        0 0 32px rgba(225, 34, 45, 0.5),
        0 0 70px rgba(184, 139, 74, 0.2);
      transform: translateZ(26px);
    }

    .tracery {
      width: 12%;
      height: 34%;
      top: 13%;
      border: 1px solid rgba(184, 139, 74, 0.22);
      border-radius: 50% 50% 4px 4px / 42% 42% 4px 4px;
      background:
        radial-gradient(circle at 50% 24%, rgba(242, 240, 235, 0.22), transparent 18%),
        linear-gradient(90deg, transparent 48%, rgba(184, 139, 74, 0.34) 49%, rgba(184, 139, 74, 0.34) 51%, transparent 52%),
        rgba(7, 6, 5, 0.28);
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.68);
      transform: translateZ(-70px);
      opacity: 0.72;
    }

    .veil,
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .veil {
      z-index: 5;
      background:
        radial-gradient(circle at 50% 48%, transparent 42%, rgba(7, 6, 5, 0.66) 88%),
        linear-gradient(180deg, rgba(7, 6, 5, 0.22), transparent 36%, rgba(7, 6, 5, 0.78));
    }

    .grain {
      z-index: 6;
      opacity: 0.12;
      background-image:
        linear-gradient(0deg, rgba(242, 240, 235, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 240, 235, 0.04) 1px, transparent 1px);
      background-size: 41px 41px, 67px 67px;
    }

    .title {
      position: fixed;
      left: clamp(22px, 5vw, 70px);
      bottom: clamp(24px, 6vh, 68px);
      z-index: 7;
      text-shadow: 0 0 24px rgba(8, 7, 7, 0.94);
      pointer-events: none;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 86px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .set-index {
      margin: 12px 0 0;
      color: rgba(242, 240, 235, 0.86);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .set-name {
      margin: 8px 0 0;
      color: var(--dim);
      font-size: 13px;
    }

    .nav {
      position: fixed;
      right: 28px;
      top: 24px;
      z-index: 7;
      display: flex;
      gap: 8px;
    }

    .nav a,
    .nav button {
      min-width: 38px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(242, 240, 235, 0.2);
      border-radius: 0;
      background: rgba(8, 7, 7, 0.48);
      color: var(--paper);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .nav a:hover,
    .nav button:hover,
    .nav a:focus-visible,
    .nav button:focus-visible {
      background: rgba(91, 20, 23, 0.36);
      border-color: rgba(242, 240, 235, 0.48);
      transform: translateY(-1px);
    }

    .set-track {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 7;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 5px;
      width: min(52vw, 620px);
      height: 2px;
      transform: translateX(-50%);
    }

    .set-track button {
      appearance: none;
      border: 0;
      padding: 0;
      background: rgba(242, 240, 235, 0.22);
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .set-track button.is-active,
    .set-track button:hover,
    .set-track button:focus-visible {
      background: rgba(242, 240, 235, 0.9);
      transform: scaleY(2.8);
    }

    @media (max-width: 720px) {
      :root {
        --zoom: 0.82;
      }

      .stage {
        width: 118vw;
      }

      .title {
        left: 20px;
        bottom: 70px;
      }

      .set-track {
        left: 20px;
        right: 20px;
        width: auto;
        transform: none;
      }

      .nav {
        right: 16px;
        top: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Sanctum set-based 3D scene">
    <div class="stage" id="stage">
      <div class="panel back-wall"></div>
      <div class="panel floor"></div>
      <div class="panel ceiling"></div>
      <div class="panel left-wall"></div>
      <div class="panel right-wall"></div>
      <div class="arch-frame"></div>
    </div>
  </main>
  <div class="veil" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <section class="title">
    <h1>Sanctum</h1>
    <p class="set-index" id="setIndex">Set 01 / 20</p>
    <p class="set-name" id="setName">Cathedral library</p>
  </section>
  <nav class="nav" aria-label="Sanctum navigation">
    <button type="button" id="prevSet" aria-label="Previous set">&lsaquo;</button>
    <button type="button" id="nextSet" aria-label="Next set">&rsaquo;</button>
    <button type="button" id="resetView" aria-label="Reset view">0</button>
    <a href="/sanctum/" aria-label="Back to Sanctum gallery">Set</a>
    <a href="/" aria-label="Back home">Back</a>
  </nav>
  <div class="set-track" id="setTrack" aria-label="Sanctum set selector"></div>
  <script>
    const root = document.documentElement;
    const scene = document.getElementById("scene");
    const stage = document.getElementById("stage");
    const setIndex = document.getElementById("setIndex");
    const setName = document.getElementById("setName");
    const setTrack = document.getElementById("setTrack");
    const prevSet = document.getElementById("prevSet");
    const nextSet = document.getElementById("nextSet");
    const resetView = document.getElementById("resetView");
    const textures = Array.from({ length: 20 }, (_, index) => `/assets/sanctum/layers/backgrounds/background-${String(index + 1).padStart(2, "0")}.png`);
    const names = [
      "Cathedral library",
      "Moonlit cloister",
      "Reliquary table",
      "Shattered chapel",
      "Manuscript desk",
      "Black cosmic room",
      "Rain threshold",
      "Bell chamber",
      "Red doorway",
      "Archive drawers",
      "Astrolabe chapel",
      "Flooded archive",
      "Vertical library",
      "Mirror corridor",
      "Winter garden",
      "Cathedral archive",
      "Observatory chapel",
      "Ritual floor",
      "Manuscript alcove",
      "Throne nave"
    ];
    let activeIndex = 0;
    let yaw = 0;
    let pitch = -6;
    let zoom = window.matchMedia("(max-width: 720px)").matches ? 0.82 : 1;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let wheelReady = true;

    setTrack.innerHTML = textures.map((_, index) => `<button type="button" class="${index === 0 ? "is-active" : ""}" aria-label="Show set ${index + 1}"></button>`).join("");
    const ticks = Array.from(setTrack.querySelectorAll("button"));

    function addRibs() {
      for (let i = -5; i <= 5; i += 1) {
        const rib = document.createElement("div");
        rib.className = "rib";
        rib.style.transform = `translateZ(${-120 - Math.abs(i) * 12}px) rotateZ(${i * 8}deg)`;
        stage.appendChild(rib);
      }
    }

    function addColumns() {
      const columns = [
        [8, 0], [16, -80], [25, -160], [35, -250],
        [92, 0], [84, -80], [75, -160], [65, -250]
      ];
      columns.forEach(([left, depth], index) => {
        const column = document.createElement("div");
        column.className = "column";
        column.style.left = `${left}%`;
        column.style.transform = `translateZ(${depth}px)`;
        column.style.opacity = `${0.9 - Math.abs(50 - left) / 90}`;
        stage.appendChild(column);

        const lamp = document.createElement("div");
        lamp.className = "lamp";
        lamp.style.left = `calc(${left}% + ${left < 50 ? 28 : -28}px)`;
        lamp.style.top = `${31 + (index % 4) * 6}%`;
        lamp.style.transform = `translateZ(${depth + 38}px)`;
        stage.appendChild(lamp);
      });
    }

    function addTracery() {
      [18, 34, 50, 66, 82].forEach((left, index) => {
        const tracery = document.createElement("div");
        tracery.className = "tracery";
        tracery.style.left = `${left - 6}%`;
        tracery.style.transform = `translateZ(${-170 - Math.abs(2 - index) * 18}px)`;
        stage.appendChild(tracery);
      });
    }

    function applyView() {
      root.style.setProperty("--yaw", `${yaw}deg`);
      root.style.setProperty("--pitch", `${pitch}deg`);
      root.style.setProperty("--zoom", zoom.toFixed(3));
    }

    function setActiveSet(index) {
      activeIndex = (index + textures.length) % textures.length;
      root.style.setProperty("--set-image", `url("${textures[activeIndex]}")`);
      setIndex.textContent = `Set ${String(activeIndex + 1).padStart(2, "0")} / ${textures.length}`;
      setName.textContent = names[activeIndex];
      ticks.forEach((tick, tickIndex) => {
        tick.classList.toggle("is-active", tickIndex === activeIndex);
      });
    }

    function stepSet(direction) {
      setActiveSet(activeIndex + direction);
    }

    scene.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      scene.setPointerCapture(event.pointerId);
    });

    scene.addEventListener("pointermove", (event) => {
      const nx = Math.max(0, Math.min(1, event.clientX / window.innerWidth));
      root.style.setProperty("--mx", `${nx * 100}%`);
      if (!dragging) return;
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      yaw = Math.max(-28, Math.min(28, yaw + dx * 0.08));
      pitch = Math.max(-16, Math.min(8, pitch - dy * 0.05));
      lastX = event.clientX;
      lastY = event.clientY;
      applyView();
    });

    scene.addEventListener("pointerup", () => {
      dragging = false;
    });

    scene.addEventListener("pointercancel", () => {
      dragging = false;
    });

    scene.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (event.ctrlKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
        zoom = Math.max(0.78, Math.min(1.22, zoom - event.deltaY * 0.0007));
        applyView();
        return;
      }
      if (!wheelReady || Math.abs(event.deltaY) < 18) return;
      wheelReady = false;
      stepSet(event.deltaY > 0 ? 1 : -1);
      window.setTimeout(() => {
        wheelReady = true;
      }, 120);
    }, { passive: false });

    ticks.forEach((tick, index) => {
      tick.addEventListener("click", () => setActiveSet(index));
    });

    prevSet.addEventListener("click", () => stepSet(-1));
    nextSet.addEventListener("click", () => stepSet(1));

    resetView.addEventListener("click", () => {
      yaw = 0;
      pitch = -6;
      zoom = window.matchMedia("(max-width: 720px)").matches ? 0.82 : 1;
      applyView();
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") stepSet(-1);
      if (event.key === "ArrowRight") stepSet(1);
      if (event.key === "ArrowUp") {
        zoom = Math.min(1.22, zoom + 0.04);
        applyView();
      }
      if (event.key === "ArrowDown") {
        zoom = Math.max(0.78, zoom - 0.04);
        applyView();
      }
      if (event.key === "Home") setActiveSet(0);
      if (event.key === "End") setActiveSet(textures.length - 1);
    });

    addRibs();
    addColumns();
    addTracery();
    setActiveSet(0);
    applyView();
  </script>
</body>
</html>
