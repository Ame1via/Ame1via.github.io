<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sanctum - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --black: #080707;
      --paper: #f2f0eb;
      --dim: #9a958b;
      --blood: #5b1417;
      --gold: #a0834d;
      --mx: 50%;
      --my: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --cell-opacity: 0.9;
      --archive-opacity: 0.18;
      --threshold-opacity: 0.16;
      --library-opacity: 0.12;
      --cloister-opacity: 0.1;
      --reliquary-opacity: 0.1;
      --chapel-opacity: 0.1;
      --manuscript-opacity: 0.1;
      --cosmic-opacity: 0.1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(91, 20, 23, 0.22), transparent 30%),
        linear-gradient(180deg, rgba(8, 7, 7, 0.08), rgba(8, 7, 7, 0.78)),
        #080707;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    .sanctum-room {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    .world-backdrop,
    .world-backdrop::before,
    .world-backdrop::after,
    .veil,
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .world-backdrop {
      z-index: 0;
      background:
        linear-gradient(90deg, rgba(8, 7, 7, 0.56), rgba(8, 7, 7, 0.2), rgba(8, 7, 7, 0.64)),
        url("/assets/sanctum/world-threshold.png") center / cover;
      opacity: 0.28;
      transform: scale(1.06);
      filter: saturate(0.7) brightness(0.62);
    }

    .world-backdrop::before {
      content: "";
      background: url("/assets/sanctum/world-archive.png") calc(50% + (var(--mx-num, 0) * -14px)) center / cover;
      opacity: 0.22;
      mix-blend-mode: screen;
    }

    .world-backdrop::after {
      content: "";
      background: radial-gradient(circle at var(--mx) var(--my), rgba(242, 240, 235, 0.16), transparent 18%);
      opacity: 0.9;
    }

    .veil {
      z-index: 5;
      background:
        radial-gradient(circle at 50% 50%, transparent 34%, rgba(8, 7, 7, 0.68) 82%),
        linear-gradient(180deg, rgba(8, 7, 7, 0.52), transparent 34%, rgba(8, 7, 7, 0.72));
    }

    .grain {
      z-index: 6;
      opacity: 0.18;
      background-image:
        linear-gradient(0deg, rgba(242, 240, 235, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 240, 235, 0.035) 1px, transparent 1px);
      background-size: 37px 37px, 53px 53px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .num-stage {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: end center;
      perspective: 1200px;
    }

    .num-window,
    .num-figure,
    .num-glow {
      position: absolute;
      left: 50%;
      bottom: -2vh;
      width: min(94vw, 118vh);
      height: 104vh;
      transform:
        translateX(-50%)
        rotateX(var(--tilt-y))
        rotateY(var(--tilt-x));
      transform-origin: 50% 62%;
      transition: transform 120ms ease-out;
    }

    .num-window {
      z-index: 2;
      overflow: hidden;
      opacity: 0.96;
      -webkit-mask-image: url("/assets/sanctum/nun-agent-prayer.png");
      mask-image: url("/assets/sanctum/nun-agent-prayer.png");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center bottom;
      mask-position: center bottom;
      -webkit-mask-size: contain;
      mask-size: contain;
      filter: drop-shadow(0 0 26px rgba(160, 131, 77, 0.2));
    }

    .num-window img {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      object-fit: cover;
      transform: translate3d(var(--pan-x), var(--pan-y), 0) scale(var(--zoom));
      transition: opacity 160ms ease, transform 120ms ease-out;
    }

    .num-window .cell {
      opacity: var(--cell-opacity);
      --pan-x: calc((50% - var(--mx)) * 0.08);
      --pan-y: calc((50% - var(--my)) * 0.08);
      --zoom: 1.08;
      filter: saturate(0.88) brightness(0.7);
    }

    .num-window .archive {
      opacity: var(--archive-opacity);
      --pan-x: calc((50% - var(--mx)) * -0.11);
      --pan-y: calc((50% - var(--my)) * -0.06);
      --zoom: 1.18;
      mix-blend-mode: screen;
      filter: saturate(0.78) contrast(1.08);
    }

    .num-window .threshold {
      opacity: var(--threshold-opacity);
      --pan-x: calc((50% - var(--mx)) * 0.14);
      --pan-y: calc((50% - var(--my)) * -0.12);
      --zoom: 1.22;
      mix-blend-mode: lighten;
      filter: saturate(0.95) brightness(0.8);
    }

    .num-window .library {
      opacity: var(--library-opacity);
      --pan-x: calc((50% - var(--mx)) * -0.18);
      --pan-y: calc((50% - var(--my)) * 0.1);
      --zoom: 1.24;
      mix-blend-mode: screen;
      filter: saturate(0.72) brightness(0.72) contrast(1.12);
    }

    .num-window .cloister {
      opacity: var(--cloister-opacity);
      --pan-x: calc((50% - var(--mx)) * 0.16);
      --pan-y: calc((50% - var(--my)) * 0.16);
      --zoom: 1.2;
      mix-blend-mode: lighten;
      filter: saturate(0.78) brightness(0.66);
    }

    .num-window .reliquary {
      opacity: var(--reliquary-opacity);
      --pan-x: calc((50% - var(--mx)) * -0.08);
      --pan-y: calc((50% - var(--my)) * -0.18);
      --zoom: 1.16;
      mix-blend-mode: screen;
      filter: saturate(0.92) brightness(0.7) contrast(1.08);
    }

    .num-window .chapel {
      opacity: var(--chapel-opacity);
      --pan-x: calc((50% - var(--mx)) * 0.2);
      --pan-y: calc((50% - var(--my)) * -0.08);
      --zoom: 1.18;
      mix-blend-mode: lighten;
      filter: saturate(0.7) brightness(0.68);
    }

    .num-window .manuscript {
      opacity: var(--manuscript-opacity);
      --pan-x: calc((50% - var(--mx)) * -0.22);
      --pan-y: calc((50% - var(--my)) * 0.2);
      --zoom: 1.26;
      mix-blend-mode: screen;
      filter: saturate(0.74) brightness(0.76);
    }

    .num-window .cosmic {
      opacity: var(--cosmic-opacity);
      --pan-x: calc((50% - var(--mx)) * 0.26);
      --pan-y: calc((50% - var(--my)) * -0.2);
      --zoom: 1.3;
      mix-blend-mode: lighten;
      filter: saturate(1.05) brightness(0.7) contrast(1.06);
    }

    .num-window::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(242, 240, 235, 0.38), transparent 19%),
        linear-gradient(180deg, rgba(8, 7, 7, 0.06), rgba(91, 20, 23, 0.38));
      mix-blend-mode: screen;
    }

    .num-figure {
      z-index: 3;
      object-fit: contain;
      object-position: center bottom;
      opacity: 0.72;
      filter:
        drop-shadow(0 0 18px rgba(242, 240, 235, 0.12))
        drop-shadow(0 22px 46px rgba(0, 0, 0, 0.74));
      mix-blend-mode: normal;
      pointer-events: none;
    }

    .num-glow {
      z-index: 1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 56%, rgba(160, 131, 77, 0.24), transparent 36%),
        radial-gradient(ellipse at 50% 54%, rgba(91, 20, 23, 0.34), transparent 48%);
      filter: blur(24px);
      opacity: 0.88;
    }

    .sigil {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: min(82vmin, 760px);
      aspect-ratio: 1;
      border: 1px solid rgba(160, 131, 77, 0.16);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(calc(var(--mx-num, 0) * 12deg));
      box-shadow:
        inset 0 0 42px rgba(91, 20, 23, 0.22),
        0 0 54px rgba(160, 131, 77, 0.12);
      opacity: 0.72;
    }

    .sigil::before,
    .sigil::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(242, 240, 235, 0.09);
      transform: rotate(45deg);
    }

    .sigil::after {
      inset: 25%;
      border-color: rgba(91, 20, 23, 0.28);
      transform: rotate(-18deg);
    }

    .sanctum-copy {
      position: fixed;
      left: clamp(22px, 5vw, 70px);
      bottom: clamp(24px, 6vh, 68px);
      z-index: 8;
      max-width: 310px;
      text-shadow: 0 0 20px rgba(8, 7, 7, 0.9);
    }

    .sanctum-copy h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 92px);
      font-weight: 400;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .sanctum-copy p {
      margin: 14px 0 0;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.65;
    }

    .back {
      position: fixed;
      right: 28px;
      bottom: 24px;
      z-index: 8;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(91, 20, 23, 0.72);
      transition: color 200ms ease, border-color 200ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--paper);
      border-color: var(--paper);
    }

    @media (max-width: 720px) {
      .num-window,
      .num-figure,
      .num-glow {
        width: 138vw;
        height: 96vh;
        bottom: 4vh;
      }

      .sanctum-copy {
        left: 20px;
        right: 20px;
        bottom: 84px;
        max-width: 240px;
      }

      .sanctum-copy p {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .num-window,
      .num-figure,
      .num-glow,
      .sigil,
      .num-window img {
        transition: none;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <main class="sanctum-room" aria-label="Sanctum world">
    <div class="world-backdrop" aria-hidden="true"></div>
    <div class="sigil" aria-hidden="true"></div>
    <section class="num-stage" aria-label="Nun Agent sanctum mask">
      <div class="num-glow" aria-hidden="true"></div>
      <div class="num-window" aria-hidden="true">
        <img class="cell" src="/assets/sanctum/world-cell.png" alt="">
        <img class="archive" src="/assets/sanctum/world-archive.png" alt="">
        <img class="threshold" src="/assets/sanctum/world-threshold.png" alt="">
        <img class="library" src="/assets/sanctum/world-library.png" alt="">
        <img class="cloister" src="/assets/sanctum/world-cloister.png" alt="">
        <img class="reliquary" src="/assets/sanctum/world-reliquary.png" alt="">
        <img class="chapel" src="/assets/sanctum/world-chapel.png" alt="">
        <img class="manuscript" src="/assets/sanctum/world-manuscript.png" alt="">
        <img class="cosmic" src="/assets/sanctum/world-cosmic.png" alt="">
      </div>
      <img class="num-figure" src="/assets/sanctum/nun-agent-prayer.png" alt="Nun Agent praying">
    </section>
    <div class="veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <section class="sanctum-copy">
      <h1>Sanctum</h1>
      <p>A world set for Ame1via: the figure stays still; the room moves through her.</p>
    </section>
    <a class="back" href="/">Back</a>
  </main>
  <script>
    const root = document.documentElement;

    function setPointer(x, y) {
      const nx = Math.max(0, Math.min(1, x / window.innerWidth));
      const ny = Math.max(0, Math.min(1, y / window.innerHeight));
      root.style.setProperty("--mx", `${nx * 100}%`);
      root.style.setProperty("--my", `${ny * 100}%`);
      root.style.setProperty("--mx-num", `${(nx - 0.5).toFixed(3)}`);
      root.style.setProperty("--tilt-x", `${((nx - 0.5) * 7).toFixed(2)}deg`);
      root.style.setProperty("--tilt-y", `${((0.5 - ny) * 4).toFixed(2)}deg`);
      root.style.setProperty("--cell-opacity", `${(0.88 - nx * 0.28).toFixed(3)}`);
      root.style.setProperty("--archive-opacity", `${(0.14 + nx * 0.58).toFixed(3)}`);
      root.style.setProperty("--threshold-opacity", `${(0.16 + ny * 0.5).toFixed(3)}`);
      root.style.setProperty("--library-opacity", `${(0.08 + Math.max(0, 0.55 - Math.abs(nx - 0.16)) * 0.9).toFixed(3)}`);
      root.style.setProperty("--cloister-opacity", `${(0.06 + Math.max(0, 0.52 - Math.abs(ny - 0.18)) * 0.72).toFixed(3)}`);
      root.style.setProperty("--reliquary-opacity", `${(0.08 + Math.max(0, 0.55 - Math.abs(nx - 0.42)) * 0.76).toFixed(3)}`);
      root.style.setProperty("--chapel-opacity", `${(0.06 + Math.max(0, 0.55 - Math.abs(ny - 0.48)) * 0.74).toFixed(3)}`);
      root.style.setProperty("--manuscript-opacity", `${(0.06 + Math.max(0, 0.5 - Math.abs(nx - 0.72)) * 0.78).toFixed(3)}`);
      root.style.setProperty("--cosmic-opacity", `${(0.08 + Math.max(0, 0.56 - Math.abs(ny - 0.82)) * 0.82).toFixed(3)}`);
    }

    window.addEventListener("pointermove", (event) => {
      setPointer(event.clientX, event.clientY);
    });

    window.addEventListener("pointerleave", () => {
      setPointer(window.innerWidth / 2, window.innerHeight / 2);
    });

    setPointer(window.innerWidth / 2, window.innerHeight / 2);
  </script>
</body>
</html>
