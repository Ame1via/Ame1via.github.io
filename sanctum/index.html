<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sanctum - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --paper: #f2f0eb;
      --dim: #9a958b;
      --blood: #5b1417;
      --mx: 50%;
      --pan-x: 0px;
      --pan-y: 0px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #080707;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    .sanctum-room {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    .set-gallery,
    .set-layer,
    .set-light,
    .set-vignette,
    .set-grain,
    .transition-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .set-gallery {
      z-index: 1;
      overflow: hidden;
      background: #080707;
    }

    .set-layer {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: translate3d(var(--pan-x), var(--pan-y), 0) scale(1.04);
      filter: saturate(0.84) brightness(0.72) contrast(1.04);
      transition: opacity 560ms ease, transform 180ms ease-out, filter 560ms ease;
    }

    .set-layer.is-active {
      z-index: 1;
      opacity: 1;
      filter: saturate(0.96) brightness(0.82) contrast(1.06);
    }

    .set-layer.is-pending {
      z-index: 2;
      opacity: 0;
      filter: saturate(0.78) brightness(0.2) contrast(1.18);
    }

    .set-light {
      z-index: 2;
      background:
        radial-gradient(circle at var(--mx) 48%, rgba(242, 240, 235, 0.16), transparent 22%),
        radial-gradient(circle at var(--mx) 58%, rgba(91, 20, 23, 0.26), transparent 34%);
      mix-blend-mode: screen;
    }

    .set-vignette {
      z-index: 3;
      background:
        radial-gradient(circle at 50% 48%, transparent 36%, rgba(8, 7, 7, 0.54) 82%),
        linear-gradient(180deg, rgba(8, 7, 7, 0.3), transparent 30%, rgba(8, 7, 7, 0.76));
    }

    .set-grain {
      z-index: 4;
      opacity: 0.16;
      background-image:
        linear-gradient(0deg, rgba(242, 240, 235, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 240, 235, 0.035) 1px, transparent 1px);
      background-size: 37px 37px, 53px 53px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .transition-canvas {
      z-index: 4;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      mix-blend-mode: screen;
      transition: opacity 180ms ease;
    }

    body.is-transitioning .transition-canvas {
      opacity: 1;
    }

    .sanctum-copy {
      position: fixed;
      left: clamp(22px, 5vw, 70px);
      bottom: clamp(24px, 6vh, 68px);
      z-index: 5;
      max-width: 320px;
      text-shadow: 0 0 24px rgba(8, 7, 7, 0.94);
    }

    .sanctum-copy h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 92px);
      font-weight: 400;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .set-index {
      margin: 14px 0 0;
      color: rgba(242, 240, 235, 0.86);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .set-name {
      margin: 8px 0 0;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.65;
    }

    .set-track {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 5px;
      width: min(46vw, 520px);
      height: 2px;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .set-track button {
      appearance: none;
      padding: 0;
      border: 0;
      background: rgba(242, 240, 235, 0.22);
      cursor: pointer;
      transition: background 220ms ease, transform 220ms ease;
    }

    .set-track button.is-active,
    .set-track button:hover,
    .set-track button:focus-visible {
      background: rgba(242, 240, 235, 0.9);
      transform: scaleY(2.5);
    }

    .back {
      position: fixed;
      right: 28px;
      bottom: 24px;
      z-index: 5;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(91, 20, 23, 0.72);
      transition: color 200ms ease, border-color 200ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--paper);
      border-color: var(--paper);
    }

    .set-controls {
      position: fixed;
      right: 28px;
      top: 24px;
      z-index: 5;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .set-controls button {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(242, 240, 235, 0.18);
      border-radius: 0;
      background: rgba(8, 7, 7, 0.42);
      color: var(--paper);
      cursor: pointer;
      font: inherit;
      transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
    }

    .set-controls button:hover,
    .set-controls button:focus-visible {
      border-color: rgba(242, 240, 235, 0.46);
      background: rgba(91, 20, 23, 0.32);
      transform: translateY(-1px);
    }

    @media (max-width: 720px) {
      .sanctum-copy {
        left: 20px;
        right: 20px;
        bottom: 72px;
        max-width: 260px;
      }

      .set-track {
        left: 20px;
        right: 20px;
        width: auto;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .set-layer,
      .set-track button,
      .transition-canvas {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="sanctum-room" aria-label="Sanctum sets">
    <div class="set-gallery" aria-hidden="true">
      <img class="set-layer is-active" src="/assets/sanctum/sets/set-01.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-02.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-03.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-04.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-05.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-06.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-07.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-08.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-09.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-10.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-11.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-12.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-13.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-14.png" alt="">
      <img class="set-layer" src="/assets/sanctum/sets/set-15.png" alt="">
    </div>
    <div class="set-light" aria-hidden="true"></div>
    <canvas class="transition-canvas" id="transitionCanvas" aria-hidden="true"></canvas>
    <div class="set-vignette" aria-hidden="true"></div>
    <div class="set-grain" aria-hidden="true"></div>
    <section class="sanctum-copy">
      <h1>Sanctum</h1>
      <p class="set-index" id="setIndex">Set 01 / 15</p>
      <p class="set-name" id="setName">Cathedral library</p>
    </section>
    <div class="set-controls" aria-label="Set controls">
      <button type="button" id="prevSet" aria-label="Previous set">&lsaquo;</button>
      <button type="button" id="nextSet" aria-label="Next set">&rsaquo;</button>
    </div>
    <div class="set-track" id="setTrack" aria-label="Sanctum set selector"></div>
    <a class="back" href="/">Back</a>
  </main>
  <script>
    const root = document.documentElement;
    const layers = Array.from(document.querySelectorAll(".set-layer"));
    const setIndex = document.getElementById("setIndex");
    const setName = document.getElementById("setName");
    const setTrack = document.getElementById("setTrack");
    const prevSet = document.getElementById("prevSet");
    const nextSet = document.getElementById("nextSet");
    const canvas = document.getElementById("transitionCanvas");
    const ctx = canvas.getContext("2d");
    const names = [
      "Cathedral library",
      "Moonlit cloister",
      "Reliquary table",
      "Shattered chapel",
      "Manuscript desk",
      "Black cosmic room",
      "Rain threshold",
      "Bell chamber",
      "Red doorway",
      "Archive drawers",
      "Astrolabe chapel",
      "Flooded archive",
      "Vertical library",
      "Mirror corridor",
      "Winter garden"
    ];
    let activeIndex = -1;
    let pendingIndex = -1;
    let isTransitioning = false;
    let wheelReady = true;
    let knitPoints = [];
    let knitEdges = [];
    let knitDegrees = [];

    setTrack.innerHTML = layers.map((_, index) => `<button class="${index === 0 ? "is-active" : ""}" type="button" aria-label="Show set ${index + 1}"></button>`).join("");
    const ticks = Array.from(setTrack.querySelectorAll("button"));

    function setActiveLayer(index) {
      if (index === activeIndex) return;
      activeIndex = index;
      layers.forEach((layer, layerIndex) => {
        layer.classList.toggle("is-active", layerIndex === index);
        layer.classList.remove("is-pending");
      });
      ticks.forEach((tick, tickIndex) => {
        tick.classList.toggle("is-active", tickIndex === index);
      });
      setIndex.textContent = `Set ${String(index + 1).padStart(2, "0")} / ${layers.length}`;
      setName.textContent = names[index];
    }

    function requestSet(index) {
      const nextIndex = (index + layers.length) % layers.length;
      if (nextIndex === activeIndex || isTransitioning) return;
      transitionTo(nextIndex);
    }

    function transitionTo(index) {
      pendingIndex = index;
      isTransitioning = true;
      layers[index].classList.add("is-pending");
      document.body.classList.add("is-transitioning");
      prepareTransition(index);
      window.requestAnimationFrame((time) => animateTransition(time, time, index));
    }

    function stepSet(direction) {
      requestSet(activeIndex + direction);
    }

    function setPointer(x, y) {
      const nx = Math.max(0, Math.min(1, x / window.innerWidth));
      const ny = Math.max(0, Math.min(1, y / window.innerHeight));
      root.style.setProperty("--mx", `${nx * 100}%`);
      root.style.setProperty("--pan-x", `${((0.5 - nx) * 22).toFixed(2)}px`);
      root.style.setProperty("--pan-y", `${((0.5 - ny) * 14).toFixed(2)}px`);
    }

    window.addEventListener("pointermove", (event) => {
      setPointer(event.clientX, event.clientY);
    });

    window.addEventListener("pointerleave", () => {
      setPointer(window.innerWidth / 2, window.innerHeight / 2);
    });

    ticks.forEach((tick, index) => {
      tick.addEventListener("click", () => requestSet(index));
    });

    prevSet.addEventListener("click", () => stepSet(-1));
    nextSet.addEventListener("click", () => stepSet(1));

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") stepSet(-1);
      if (event.key === "ArrowRight") stepSet(1);
    });

    window.addEventListener("wheel", (event) => {
      if (!wheelReady || Math.abs(event.deltaY) < 18) return;
      wheelReady = false;
      stepSet(event.deltaY > 0 ? 1 : -1);
      window.setTimeout(() => {
        wheelReady = true;
      }, 420);
    }, { passive: true });

    setPointer(window.innerWidth / 2, window.innerHeight / 2);
    setActiveLayer(0);
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * ratio);
      canvas.height = Math.round(window.innerHeight * ratio);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function prepareTransition(index) {
      resizeCanvas();
      const width = window.innerWidth;
      const height = window.innerHeight;
      knitPoints = generateKnitPoints(index, width, height);
      relaxKnitPoints(width, height, 4);
      knitEdges = generateKnitEdges(width, height);
      knitDegrees = new Array(knitPoints.length).fill(0);
      for (const edge of knitEdges) {
        knitDegrees[edge.a.id] += 1;
        knitDegrees[edge.b.id] += 1;
      }
      knitPoints.sort((a, b) => a.brightness - b.brightness);
    }

    function animateTransition(start, now, index) {
      const duration = 1680;
      const progress = Math.min(1, (now - start) / duration);
      drawTransition(progress, index);

      if (progress > 0.93 && pendingIndex === index) {
        pendingIndex = -1;
        setActiveLayer(index);
      }

      if (progress < 1) {
        window.requestAnimationFrame((time) => animateTransition(start, time, index));
        return;
      }

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      document.body.classList.remove("is-transitioning");
      isTransitioning = false;
    }

    function drawTransition(progress, index) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      ctx.clearRect(0, 0, width, height);

      const wallProgress = smootherstep(0, 0.42, progress);
      const knitProgress = smoothstep(0.08, 0.98, progress);
      const knitFade = 1 - smoothstep(0.86, 1, progress);

      drawFourthWall(layers[activeIndex], layers[index], wallProgress, progress, index);

      drawKnitMesh(knitProgress, knitFade);

      const flash = smoothstep(0.82, 1, progress);
      ctx.save();
      ctx.globalAlpha = flash * 0.12;
      ctx.fillStyle = "rgba(242, 240, 235, 1)";
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    function drawFourthWall(currentImage, nextImage, wallProgress, totalProgress, index) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const mode = index % 5;
      const settle = smoothstep(0.26, 0.86, totalProgress);

      ctx.save();
      ctx.globalAlpha = 0.18 * (1 - settle);
      drawCoverImage(currentImage, 0, 0, width, height);
      ctx.fillStyle = "rgba(8, 7, 7, 0.72)";
      ctx.fillRect(0, 0, width, height);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.18 + settle * 0.22;
      ctx.filter = `brightness(${0.18 + settle * 0.34}) saturate(0.86) contrast(1.1)`;
      drawCoverImage(nextImage, 0, 0, width, height);
      ctx.filter = "none";
      ctx.fillStyle = "rgba(8, 7, 7, 0.48)";
      ctx.fillRect(0, 0, width, height);
      ctx.restore();

      if (mode === 0) drawPanelWall(nextImage, wallProgress, totalProgress);
      if (mode === 1) drawSplitWall(nextImage, wallProgress, totalProgress);
      if (mode === 2) drawDiagonalWall(nextImage, wallProgress, totalProgress);
      if (mode === 3) drawCurtainWall(nextImage, wallProgress, totalProgress);
      if (mode === 4) drawPushWall(nextImage, wallProgress, totalProgress);

      ctx.save();
      ctx.globalAlpha = 0.24 + settle * 0.18;
      ctx.fillStyle = "rgba(8, 7, 7, 0.48)";
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    function drawPanelWall(nextImage, wallProgress, totalProgress) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const panelCount = 9;
      const panelWidth = width / panelCount;
      const center = (panelCount - 1) / 2;

      ctx.save();
      ctx.globalAlpha = 0.22 + wallProgress * 0.44;
      ctx.fillStyle = "rgba(8, 7, 7, 0.86)";
      ctx.fillRect(0, 0, width, height);
      ctx.restore();

      for (let i = 0; i < panelCount; i += 1) {
        const distance = Math.abs(i - center);
        const panelProgress = Math.max(0, Math.min(1, (wallProgress - distance * 0.05) / 0.28));
        if (panelProgress <= 0) continue;

        const open = smootherstep(0, 1, panelProgress);
        const x = i * panelWidth;
        const direction = i < center ? -1 : 1;
        const hinge = i === center ? 0 : direction;
        const push = Math.sin(open * Math.PI) * 42;
        const fold = (1 - open) * panelWidth * 0.38;
        const drawX = hinge * fold - push * 0.5;
        const drawY = (1 - open) * height * 0.07;
        const drawW = width + push;
        const drawH = height - drawY * 2;

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, 0, panelWidth + 1, height);
        ctx.clip();
        ctx.globalAlpha = 0.16 + open * 0.7;
        ctx.filter = `brightness(${0.24 + open * 0.46}) saturate(${0.76 + open * 0.2}) contrast(1.12)`;
        drawCoverImage(nextImage, drawX, drawY, drawW, drawH);
        ctx.filter = "none";

        ctx.globalAlpha = (1 - open) * 0.5 + 0.12;
        ctx.fillStyle = i % 2 ? "rgba(8, 7, 7, 0.52)" : "rgba(242, 240, 235, 0.05)";
        ctx.fillRect(x, 0, panelWidth + 1, height);

        ctx.globalAlpha = 0.18 + open * 0.22;
        ctx.strokeStyle = "rgba(242, 240, 235, 0.28)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + (direction > 0 ? 0 : panelWidth), height * 0.08);
        ctx.lineTo(x + (direction > 0 ? 0 : panelWidth), height * 0.92);
        ctx.stroke();
        ctx.restore();
      }

      const aperture = smoothstep(0.35, 1, wallProgress);
      ctx.save();
      ctx.globalAlpha = aperture * 0.32;
      ctx.fillStyle = "rgba(242, 240, 235, 1)";
      ctx.fillRect(width * (0.5 - aperture * 0.05), 0, width * aperture * 0.1, height);
      ctx.restore();
    }

    function drawSplitWall(nextImage, wallProgress) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const open = smootherstep(0, 1, wallProgress);
      const slit = width * (0.02 + open * 0.78);

      ctx.save();
      ctx.beginPath();
      ctx.rect(width / 2 - slit / 2, 0, slit, height);
      ctx.clip();
      ctx.globalAlpha = 0.34 + open * 0.42;
      ctx.filter = `brightness(${0.28 + open * 0.42}) contrast(1.12)`;
      drawCoverImage(nextImage, -open * 26, 0, width + open * 52, height);
      ctx.filter = "none";
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.32 * (1 - open);
      ctx.fillStyle = "rgba(242, 240, 235, 1)";
      ctx.fillRect(width / 2 - 1, 0, 2, height);
      ctx.restore();
    }

    function drawDiagonalWall(nextImage, wallProgress) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const open = smootherstep(0, 1, wallProgress);
      const sweep = (width + height) * open;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(sweep, height);
      ctx.lineTo(sweep - height * 0.58, 0);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = 0.26 + open * 0.5;
      ctx.filter = `brightness(${0.24 + open * 0.44}) saturate(0.9) contrast(1.14)`;
      drawCoverImage(nextImage, -24 + open * 24, 0, width, height);
      ctx.filter = "none";
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = Math.sin(open * Math.PI) * 0.22;
      ctx.strokeStyle = "rgba(242, 240, 235, 0.72)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sweep - height * 0.58, 0);
      ctx.lineTo(sweep, height);
      ctx.stroke();
      ctx.restore();
    }

    function drawCurtainWall(nextImage, wallProgress) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const open = smootherstep(0, 1, wallProgress);
      const gap = height * (0.04 + open * 0.78);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, height / 2 - gap / 2, width, gap);
      ctx.clip();
      ctx.globalAlpha = 0.28 + open * 0.46;
      ctx.filter = `brightness(${0.22 + open * 0.44}) saturate(0.9)`;
      drawCoverImage(nextImage, 0, -open * 18, width, height + open * 36);
      ctx.filter = "none";
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.42 * (1 - open);
      ctx.fillStyle = "rgba(8, 7, 7, 0.92)";
      ctx.fillRect(0, 0, width, height / 2 - gap / 2);
      ctx.fillRect(0, height / 2 + gap / 2, width, height / 2 - gap / 2);
      ctx.restore();
    }

    function drawPushWall(nextImage, wallProgress) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const open = smootherstep(0, 1, wallProgress);
      const scale = 1.14 - open * 0.14;
      const insetX = width * (1 - scale) / 2;
      const insetY = height * (1 - scale) / 2;

      ctx.save();
      ctx.globalAlpha = 0.18 + open * 0.58;
      ctx.filter = `brightness(${0.2 + open * 0.5}) saturate(${0.78 + open * 0.14}) contrast(1.16)`;
      drawCoverImage(nextImage, insetX, insetY, width * scale, height * scale);
      ctx.filter = "none";
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = Math.sin(open * Math.PI) * 0.26;
      ctx.strokeStyle = "rgba(242, 240, 235, 0.48)";
      ctx.lineWidth = 1;
      ctx.strokeRect(width * (0.08 + (1 - open) * 0.1), height * (0.08 + (1 - open) * 0.1), width * (0.84 - (1 - open) * 0.2), height * (0.84 - (1 - open) * 0.2));
      ctx.restore();
    }

    function drawKnitMesh(progress, fade) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const scale = knitScale(width, height);
      const visibleCount = Math.floor(knitPoints.length * smootherstep(0, 1, progress));
      const visible = new Set();
      for (let i = 0; i < visibleCount; i += 1) {
        visible.add(knitPoints[i].id);
      }

      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = "rgba(242, 240, 235, 0.07)";
      ctx.fill(numPath(width, height));
      ctx.restore();

      ctx.save();
      ctx.clip(numPath(width, height));
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (const edge of knitEdges) {
        const aVisible = visible.has(edge.a.id);
        const bVisible = visible.has(edge.b.id);
        if (!aVisible && !bVisible) continue;

        const local = Math.max(0, Math.min(1, (progress - edge.delay) / 0.24));
        if (local <= 0) continue;

        const lineProgress = aVisible && bVisible ? 1 : local;
        const alpha = fade * local * (0.18 + (1 - edge.brightness) * 0.58);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = edge.brightness < 0.34 ? "rgba(238, 231, 210, 0.9)" : "rgba(145, 31, 40, 0.72)";
        ctx.lineWidth = edge.brightness < 0.34 ? 0.9 : 0.68;
        ctx.shadowColor = edge.brightness < 0.34 ? "rgba(242, 240, 235, 0.16)" : "rgba(132, 24, 33, 0.22)";
        ctx.shadowBlur = 8;
        drawPartialEdge(edge.a, edge.b, lineProgress);
      }
      ctx.restore();

      ctx.save();
      ctx.clip(numPath(width, height));
      ctx.globalAlpha = fade * smoothstep(0.7, 1, progress) * 0.58;
      ctx.fillStyle = "rgba(242, 240, 235, 0.82)";
      for (let i = 0; i < visibleCount; i += 1) {
        const point = knitPoints[i];
        if (knitDegrees[point.id] < 4) continue;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 1.05, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = fade * smoothstep(0.36, 1, progress) * 0.74;
      ctx.strokeStyle = "rgba(242, 240, 235, 0.72)";
      ctx.lineWidth = 1.05;
      ctx.shadowColor = "rgba(242, 240, 235, 0.2)";
      ctx.shadowBlur = 16;
      strokeDashedPath(numPath(width, height), smoothstep(0.32, 1, progress), scale);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = fade * smoothstep(0.46, 1, progress) * 0.6;
      ctx.strokeStyle = "rgba(132, 24, 33, 0.86)";
      ctx.lineWidth = 1.2;
      strokeDashedPath(handPath(width, height), smoothstep(0.42, 1, progress), scale);
      ctx.restore();
    }

    function generateKnitPoints(index, width, height) {
      const result = [];
      const scale = knitScale(width, height);
      const target = Math.round((scale * scale) / 1050);
      let attempts = 0;

      while (result.length < target && attempts < target * 80) {
        attempts += 1;
        const nx = seeded(index, attempts, 1, 0) * 0.92 - 0.46;
        const ny = seeded(index, attempts, 2, 0) * 1.18 - 0.58;
        if (!insideNum(nx, ny)) continue;

        const brightness = syntheticKnitBrightness(nx, ny);
        const probability = Math.max(0.006, Math.pow(1 - brightness, 5.8));
        if (seeded(index, attempts, 3, 0) > probability) continue;

        const point = toKnitScreen(
          nx + (seeded(index, attempts, 4, 0) - 0.5) * 0.01,
          ny + (seeded(index, attempts, 5, 0) - 0.5) * 0.01,
          width,
          height
        );
        point.nx = nx;
        point.ny = ny;
        point.brightness = brightness;
        point.id = result.length;
        result.push(point);
      }

      return result;
    }

    function relaxKnitPoints(width, height, iterations) {
      const scale = knitScale(width, height);
      const maxDistance = scale * 0.095;

      for (let iter = 0; iter < iterations; iter += 1) {
        const moved = knitPoints.map((point) => ({ x: point.x, y: point.y, count: 1 }));

        for (let i = 0; i < knitPoints.length; i += 1) {
          for (let j = i + 1; j < knitPoints.length; j += 1) {
            const a = knitPoints[i];
            const b = knitPoints[j];
            const distance = Math.hypot(a.x - b.x, a.y - b.y);
            if (distance > maxDistance) continue;
            moved[i].x += b.x;
            moved[i].y += b.y;
            moved[i].count += 1;
            moved[j].x += a.x;
            moved[j].y += a.y;
            moved[j].count += 1;
          }
        }

        for (let i = 0; i < knitPoints.length; i += 1) {
          const avgX = moved[i].x / moved[i].count;
          const avgY = moved[i].y / moved[i].count;
          knitPoints[i].x += (avgX - knitPoints[i].x) * 0.22;
          knitPoints[i].y += (avgY - knitPoints[i].y) * 0.22;
        }
      }
    }

    function generateKnitEdges(width, height) {
      const result = [];
      const used = new Set();
      const maxDistance = knitScale(width, height) * 0.082;

      for (let i = 0; i < knitPoints.length; i += 1) {
        const candidates = [];
        for (let j = 0; j < knitPoints.length; j += 1) {
          if (i === j) continue;
          const distance = Math.hypot(knitPoints[i].x - knitPoints[j].x, knitPoints[i].y - knitPoints[j].y);
          if (distance > maxDistance) continue;
          const mid = fromKnitScreen((knitPoints[i].x + knitPoints[j].x) / 2, (knitPoints[i].y + knitPoints[j].y) / 2, width, height);
          if (!insideNum(mid.nx, mid.ny)) continue;
          candidates.push({ point: knitPoints[j], distance });
        }

        candidates
          .sort((a, b) => a.distance - b.distance)
          .slice(0, 4)
          .forEach(({ point, distance }) => {
            const a = Math.min(knitPoints[i].id, point.id);
            const b = Math.max(knitPoints[i].id, point.id);
            const key = `${a}:${b}`;
            if (used.has(key)) return;
            used.add(key);
            result.push({
              a: knitPoints[i],
              b: point,
              distance,
              brightness: Math.max(knitPoints[i].brightness, point.brightness),
              delay: Math.min(knitPoints[i].brightness, point.brightness) * 0.56 + distance / maxDistance * 0.12
            });
          });
      }

      return result.sort((a, b) => a.delay - b.delay);
    }

    function syntheticKnitBrightness(nx, ny) {
      const face = ellipse(nx, ny, 0, -0.22, 0.16, 0.13) ? 0.18 : 0.62;
      const hood = ellipse(nx, ny, 0, -0.25, 0.31, 0.24) ? 0.3 : 0.7;
      const hands = ellipse(nx, ny, 0, 0.08, 0.2, 0.08) ? 0.08 : 0.72;
      const robe = Math.abs(nx) < 0.16 + (ny + 0.08) * 0.3 && ny > -0.1 ? 0.36 + Math.abs(nx) * 0.7 : 0.8;
      const fold = 0.18 * Math.abs(Math.sin(nx * 34 + ny * 18));
      return Math.max(0.04, Math.min(0.92, Math.min(face, hood, hands, robe) + fold));
    }

    function drawPartialEdge(a, b, progress) {
      const eased = smootherstep(0, 1, progress);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + (b.x - a.x) * eased, a.y + (b.y - a.y) * eased);
      ctx.stroke();
    }

    function drawCoverImage(image, x, y, width, height) {
      if (!image || !image.naturalWidth || !image.naturalHeight) return;

      const imageRatio = image.naturalWidth / image.naturalHeight;
      const viewRatio = window.innerWidth / window.innerHeight;
      let sourceX = 0;
      let sourceY = 0;
      let sourceWidth = image.naturalWidth;
      let sourceHeight = image.naturalHeight;

      if (imageRatio > viewRatio) {
        sourceWidth = image.naturalHeight * viewRatio;
        sourceX = (image.naturalWidth - sourceWidth) / 2;
      } else {
        sourceHeight = image.naturalWidth / viewRatio;
        sourceY = (image.naturalHeight - sourceHeight) / 2;
      }

      ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
    }

    function numPath(width, height) {
      const p = new Path2D();
      p.moveTo(...knitXY(0, -0.52, width, height));
      p.bezierCurveTo(...knitXY(-0.22, -0.52, width, height), ...knitXY(-0.34, -0.36, width, height), ...knitXY(-0.31, -0.19, width, height));
      p.bezierCurveTo(...knitXY(-0.47, -0.02, width, height), ...knitXY(-0.42, 0.3, width, height), ...knitXY(-0.34, 0.5, width, height));
      p.bezierCurveTo(...knitXY(-0.18, 0.57, width, height), ...knitXY(0.18, 0.57, width, height), ...knitXY(0.34, 0.5, width, height));
      p.bezierCurveTo(...knitXY(0.42, 0.3, width, height), ...knitXY(0.47, -0.02, width, height), ...knitXY(0.31, -0.19, width, height));
      p.bezierCurveTo(...knitXY(0.34, -0.36, width, height), ...knitXY(0.22, -0.52, width, height), ...knitXY(0, -0.52, width, height));
      p.closePath();
      return p;
    }

    function handPath(width, height) {
      const p = new Path2D();
      p.moveTo(...knitXY(-0.22, 0.03, width, height));
      p.bezierCurveTo(...knitXY(-0.12, 0.1, width, height), ...knitXY(-0.04, 0.14, width, height), ...knitXY(0, 0.14, width, height));
      p.bezierCurveTo(...knitXY(0.04, 0.14, width, height), ...knitXY(0.12, 0.1, width, height), ...knitXY(0.22, 0.03, width, height));
      return p;
    }

    function strokeDashedPath(path, progress, scale) {
      ctx.save();
      ctx.setLineDash([scale * 3, scale * 3]);
      ctx.lineDashOffset = scale * 3 * (1 - progress);
      ctx.stroke(path);
      ctx.restore();
    }

    function insideNum(nx, ny) {
      const head = ellipse(nx, ny, 0, -0.22, 0.17, 0.13);
      const hood = ellipse(nx, ny, 0, -0.23, 0.31, 0.25);
      const body = ellipse(nx, ny, 0, 0.16, 0.36, 0.46);
      const robe = ny > -0.08 && ny < 0.56 && Math.abs(nx) < 0.17 + (ny + 0.08) * 0.35;
      const hands = ellipse(nx, ny, 0, 0.08, 0.2, 0.08);
      return head || hood || body || robe || hands;
    }

    function knitScale(width, height) {
      return Math.min(width * 0.68, height * 0.98);
    }

    function toKnitScreen(nx, ny, width, height) {
      const scale = knitScale(width, height);
      return { x: width / 2 + nx * scale, y: height * 0.51 + ny * scale };
    }

    function fromKnitScreen(x, y, width, height) {
      const scale = knitScale(width, height);
      return { nx: (x - width / 2) / scale, ny: (y - height * 0.51) / scale };
    }

    function knitXY(nx, ny, width, height) {
      const point = toKnitScreen(nx, ny, width, height);
      return [point.x, point.y];
    }

    function ellipse(x, y, cx, cy, rx, ry) {
      return (((x - cx) * (x - cx)) / (rx * rx)) + (((y - cy) * (y - cy)) / (ry * ry)) <= 1;
    }

    function smoothstep(edge0, edge1, value) {
      const x = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
      return x * x * (3 - 2 * x);
    }

    function smootherstep(edge0, edge1, value) {
      const x = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
      return x * x * x * (x * (x * 6 - 15) + 10);
    }

    function seeded(a, b, c, d) {
      const value = Math.sin((a + 1) * 12.9898 + (b + 1) * 78.233 + (c + 1) * 37.719 + d * 19.19) * 43758.5453;
      return value - Math.floor(value);
    }
  </script>
