<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sanctum - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --paper: #f2f0eb;
      --dim: #9a958b;
      --blood: #5b1417;
      --mx: 50%;
      --pan-x: 0px;
      --pan-y: 0px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #080707;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    .sanctum-room {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    .set-gallery,
    .set-layer,
    .set-light,
    .set-vignette,
    .set-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .set-gallery {
      z-index: 1;
      overflow: hidden;
      background: #080707;
    }

    .set-layer {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: translate3d(var(--pan-x), var(--pan-y), 0) scale(1.04);
      filter: saturate(0.9) brightness(0.82) contrast(1.04);
      transition: opacity 260ms ease, transform 180ms ease-out, filter 260ms ease;
    }

    .set-layer.is-active {
      z-index: 1;
      opacity: 1;
      filter: saturate(1) brightness(0.94) contrast(1.06);
    }

    .set-layer.is-pending {
      z-index: 2;
      opacity: 0;
      filter: saturate(0.82) brightness(0.28) contrast(1.16);
    }

    .set-light {
      z-index: 3;
      background:
        radial-gradient(circle at var(--mx) 48%, rgba(242, 240, 235, 0.16), transparent 22%),
        radial-gradient(circle at var(--mx) 58%, rgba(91, 20, 23, 0.26), transparent 34%);
      mix-blend-mode: screen;
    }

    .set-vignette {
      z-index: 4;
      background:
        radial-gradient(circle at 50% 48%, transparent 36%, rgba(8, 7, 7, 0.54) 82%),
        linear-gradient(180deg, rgba(8, 7, 7, 0.3), transparent 30%, rgba(8, 7, 7, 0.76));
    }

    .set-grain {
      z-index: 5;
      opacity: 0.16;
      background-image:
        linear-gradient(0deg, rgba(242, 240, 235, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 240, 235, 0.035) 1px, transparent 1px);
      background-size: 37px 37px, 53px 53px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .sanctum-copy {
      position: fixed;
      left: clamp(22px, 5vw, 70px);
      bottom: clamp(24px, 6vh, 68px);
      z-index: 7;
      max-width: 320px;
      text-shadow: 0 0 24px rgba(8, 7, 7, 0.94);
    }

    .sanctum-copy h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 92px);
      font-weight: 400;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .set-index {
      margin: 14px 0 0;
      color: rgba(242, 240, 235, 0.86);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .set-name {
      margin: 8px 0 0;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.65;
    }

    .set-track {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 7;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 5px;
      width: min(46vw, 520px);
      height: 2px;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .set-track button {
      appearance: none;
      padding: 0;
      border: 0;
      background: rgba(242, 240, 235, 0.22);
      cursor: pointer;
      transition: background 220ms ease, transform 220ms ease;
    }

    .set-track button.is-active,
    .set-track button:hover,
    .set-track button:focus-visible {
      background: rgba(242, 240, 235, 0.9);
      transform: scaleY(2.5);
    }

    .back {
      position: fixed;
      right: 28px;
      bottom: 24px;
      z-index: 7;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(91, 20, 23, 0.72);
      transition: color 200ms ease, border-color 200ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--paper);
      border-color: var(--paper);
    }

    .set-controls {
      position: fixed;
      right: 28px;
      top: 24px;
      z-index: 5;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .set-controls button {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(242, 240, 235, 0.18);
      border-radius: 0;
      background: rgba(8, 7, 7, 0.42);
      color: var(--paper);
      cursor: pointer;
      font: inherit;
      transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
    }

    .set-controls button:hover,
    .set-controls button:focus-visible {
      border-color: rgba(242, 240, 235, 0.46);
      background: rgba(91, 20, 23, 0.32);
      transform: translateY(-1px);
    }

    @media (max-width: 720px) {
      .sanctum-copy {
        left: 20px;
        right: 20px;
        bottom: 72px;
        max-width: 260px;
      }

      .set-track {
        left: 20px;
        right: 20px;
        width: auto;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .set-layer,
      .set-track button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="sanctum-room" aria-label="Sanctum sets">
    <div class="set-gallery" aria-hidden="true">
      <img class="set-layer is-active" src="/assets/sanctum/layers/backgrounds/background-01.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-02.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-03.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-04.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-05.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-06.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-07.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-08.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-09.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-10.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-11.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-12.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-13.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-14.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-15.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-16.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-17.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-18.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-19.png" alt="">
      <img class="set-layer" src="/assets/sanctum/layers/backgrounds/background-20.png" alt="">
    </div>
    <div class="set-light" aria-hidden="true"></div>
    <div class="set-vignette" aria-hidden="true"></div>
    <div class="set-grain" aria-hidden="true"></div>
    <section class="sanctum-copy">
      <h1>Sanctum</h1>
      <p class="set-index" id="setIndex">Set 01 / 20</p>
      <p class="set-name" id="setName">Cathedral library</p>
    </section>
    <div class="set-controls" aria-label="Set controls">
      <button type="button" id="prevSet" aria-label="Previous set">&lsaquo;</button>
      <button type="button" id="nextSet" aria-label="Next set">&rsaquo;</button>
    </div>
    <div class="set-track" id="setTrack" aria-label="Sanctum set selector"></div>
    <a class="back" href="/">Back</a>
  </main>
  <script>
    const root = document.documentElement;
    const layers = Array.from(document.querySelectorAll(".set-layer"));
    const setIndex = document.getElementById("setIndex");
    const setName = document.getElementById("setName");
    const setTrack = document.getElementById("setTrack");
    const prevSet = document.getElementById("prevSet");
    const nextSet = document.getElementById("nextSet");
    const names = [
      "Cathedral library",
      "Moonlit cloister",
      "Reliquary table",
      "Shattered chapel",
      "Manuscript desk",
      "Black cosmic room",
      "Rain threshold",
      "Bell chamber",
      "Red doorway",
      "Archive drawers",
      "Astrolabe chapel",
      "Flooded archive",
      "Vertical library",
      "Mirror corridor",
      "Winter garden",
      "Cathedral archive",
      "Observatory chapel",
      "Ritual floor",
      "Manuscript alcove",
      "Throne nave"
    ];
    let activeIndex = -1;
    let wheelReady = true;

    setTrack.innerHTML = layers.map((_, index) => `<button class="${index === 0 ? "is-active" : ""}" type="button" aria-label="Show set ${index + 1}"></button>`).join("");
    const ticks = Array.from(setTrack.querySelectorAll("button"));

    function setActiveLayer(index) {
      const nextIndex = (index + layers.length) % layers.length;
      if (nextIndex === activeIndex) return;
      activeIndex = nextIndex;
      layers.forEach((layer, layerIndex) => {
        layer.classList.toggle("is-active", layerIndex === nextIndex);
      });
      ticks.forEach((tick, tickIndex) => {
        tick.classList.toggle("is-active", tickIndex === nextIndex);
      });
      setIndex.textContent = `Set ${String(nextIndex + 1).padStart(2, "0")} / ${layers.length}`;
      setName.textContent = names[nextIndex];
    }

    function stepSet(direction) {
      setActiveLayer(activeIndex + direction);
    }

    function setPointer(x, y) {
      const nx = Math.max(0, Math.min(1, x / window.innerWidth));
      const ny = Math.max(0, Math.min(1, y / window.innerHeight));
      root.style.setProperty("--mx", `${nx * 100}%`);
      root.style.setProperty("--pan-x", `${((0.5 - nx) * 16).toFixed(2)}px`);
      root.style.setProperty("--pan-y", `${((0.5 - ny) * 10).toFixed(2)}px`);
    }

    window.addEventListener("pointermove", (event) => {
      setPointer(event.clientX, event.clientY);
    });

    window.addEventListener("pointerleave", () => {
      setPointer(window.innerWidth / 2, window.innerHeight / 2);
    });

    ticks.forEach((tick, index) => {
      tick.addEventListener("click", () => setActiveLayer(index));
    });

    prevSet.addEventListener("click", () => stepSet(-1));
    nextSet.addEventListener("click", () => stepSet(1));

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") stepSet(-1);
      if (event.key === "ArrowRight") stepSet(1);
      if (event.key === "Home") setActiveLayer(0);
      if (event.key === "End") setActiveLayer(layers.length - 1);
    });

    window.addEventListener("wheel", (event) => {
      if (!wheelReady || Math.abs(event.deltaY) < 14) return;
      wheelReady = false;
      stepSet(event.deltaY > 0 ? 1 : -1);
      window.setTimeout(() => {
        wheelReady = true;
      }, 120);
    }, { passive: true });

    setPointer(window.innerWidth / 2, window.innerHeight / 2);
    setActiveLayer(0);
  </script>
</body>
</html>
