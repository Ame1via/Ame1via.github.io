<!DOCTYPE html>
<html lang="en">
<head>
  <title>No room here</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #8b8781;
      --blood: #5b1417;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 400;
    }

    a {
      color: var(--dim);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
    }

    .agent-widget {
      position: fixed;
      right: 26px;
      bottom: 22px;
      width: 82px;
      height: 90px;
      margin: 0;
      opacity: 0.72;
    }

    .agent-widget img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <main>
    <div>
      <h1>No room here.</h1>
      <a href="/">Back</a>
    </div>
  </main>
  <figure class="agent-widget" aria-label="Nun Agent">
    <img src="/assets/nun-agent/nun-agent-idle.gif" alt="Nun Agent">
  </figure>
</body>
</html>
