<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>Study Gate - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #948d83;
      --line: rgba(242, 240, 235, 0.16);
      --blood: #64181f;
      --panel: rgba(14, 13, 13, 0.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(8, 7, 7, 0.84), rgba(8, 7, 7, 0.94)),
        url("/assets/fussli-fragments-bg.png") center / cover fixed,
        #080707;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .gate {
      width: min(100%, 420px);
      border: 1px solid var(--line);
      padding: clamp(22px, 4vw, 34px);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 84px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .note {
      margin: 16px 0 24px;
      color: var(--dim);
      font-size: 14px;
      line-height: 1.75;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 94px;
      gap: 8px;
    }

    input,
    button {
      min-height: 42px;
      border: 1px solid rgba(242, 240, 235, 0.16);
      border-radius: 0;
      font: inherit;
    }

    input {
      width: 100%;
      background: rgba(13, 12, 12, 0.62);
      color: var(--paper);
      padding: 10px 12px;
      outline: none;
    }

    input:focus {
      border-color: rgba(242, 240, 235, 0.42);
    }

    button {
      background: rgba(100, 24, 31, 0.22);
      color: var(--paper);
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(242, 240, 235, 0.42);
      background: rgba(100, 24, 31, 0.32);
    }

    .message {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
    }

    .back:hover,
    .back:focus-visible {
      color: var(--paper);
      border-color: var(--paper);
    }

    @media (max-width: 460px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="gate" aria-label="Study password gate">
      <h1>Study</h1>
      <p class="note">法律、日语、经济。中国留学生向けの学習室。</p>

      <form id="gateForm">
        <label for="password">Password</label>
        <div class="row">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="submit">Enter</button>
        </div>
        <p class="message" id="message" aria-live="polite"></p>
      </form>

      <a class="back" href="/">Back</a>
    </section>
  </main>

  <script>
    const passwordHash = "bb882703f216ec0c3734da95d1ca54535c84c5aef6545d0b6dccf15143a8e846";
    const sessionKey = "ame-study-unlocked";
    const form = document.getElementById("gateForm");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    async function sha256(value) {
      const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
      return [...new Uint8Array(bytes)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    if (sessionStorage.getItem(sessionKey) === "true") {
      window.location.replace("/study/app/");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const inputHash = await sha256(password.value);

      if (inputHash === passwordHash) {
        sessionStorage.setItem(sessionKey, "true");
        message.textContent = "開きます。";
        window.location.href = "/study/app/";
        return;
      }

      password.value = "";
      password.focus();
      message.textContent = "密码不对。";
    });
  </script>
</body>
</html>
