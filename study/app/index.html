<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>Study - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (sessionStorage.getItem("ame-study-unlocked") !== "true") {
      window.location.replace("/study/");
    }
  </script>

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #948d83;
      --line: rgba(242, 240, 235, 0.16);
      --blood: #64181f;
      --wine: #8c2631;
      --gold: #a0834d;
      --green: #60765f;
      --blue: #647f8a;
      --violet: #76638b;
      --panel: rgba(14, 13, 13, 0.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(8, 7, 7, 0.84), rgba(8, 7, 7, 0.94)),
        url("/assets/fussli-fragments-bg.png") center / cover fixed,
        #080707;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", serif;
    }

    button { cursor: pointer; font: inherit; }

    main {
      width: min(100%, 1240px);
      margin: 0 auto;
      padding: clamp(22px, 4vw, 54px);
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 112px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 0;
      max-width: 650px;
      color: var(--dim);
      font-size: 15px;
      line-height: 1.75;
    }

    .back {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
      transition: color 180ms ease, border-color 180ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--paper);
      border-color: var(--paper);
    }

    .study-shell {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 286px;
      gap: 18px;
      align-items: start;
    }

    .rail,
    .workspace,
    .control-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .rail,
    .control-panel {
      position: sticky;
      top: 22px;
      padding: 14px;
    }

    .rail-title,
    .panel-title,
    .section-label {
      margin: 0 0 10px;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .subject-list,
    .topic-list,
    .mode-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .subject-button,
    .topic-button,
    .mode-button,
    .answer-button,
    .action-button {
      width: 100%;
      border: 1px solid rgba(242, 240, 235, 0.14);
      background: rgba(13, 12, 12, 0.56);
      color: var(--paper);
      text-align: left;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .subject-button,
    .topic-button,
    .mode-button {
      min-height: 42px;
      padding: 10px 11px;
      font-size: 13px;
      line-height: 1.25;
    }

    .subject-button:hover,
    .topic-button:hover,
    .mode-button:hover,
    .answer-button:hover,
    .action-button:hover,
    .subject-button:focus-visible,
    .topic-button:focus-visible,
    .mode-button:focus-visible,
    .answer-button:focus-visible,
    .action-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(242, 240, 235, 0.38);
      background: rgba(100, 24, 31, 0.22);
    }

    .subject-button.is-active,
    .topic-button.is-active,
    .mode-button.is-active {
      border-color: rgba(160, 131, 77, 0.7);
      background: rgba(160, 131, 77, 0.16);
    }

    .subject-button span,
    .topic-button span {
      display: block;
      margin-top: 4px;
      color: var(--dim);
      font-size: 11px;
      line-height: 1.35;
    }

    .workspace {
      min-height: 650px;
      padding: clamp(18px, 3vw, 30px);
    }

    .path {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .path span {
      border: 1px solid rgba(242, 240, 235, 0.13);
      padding: 6px 8px;
      color: var(--dim);
      font-size: 12px;
      background: rgba(13, 12, 12, 0.44);
    }

    .lesson-title {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: 0;
    }

    .lesson-kicker {
      margin: 12px 0 0;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .lesson-copy {
      margin: 22px 0 0;
      color: rgba(242, 240, 235, 0.88);
      font-size: clamp(16px, 1.8vw, 20px);
      line-height: 1.85;
    }

    .term-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .term-card {
      min-height: 88px;
      border: 1px solid rgba(242, 240, 235, 0.13);
      padding: 13px;
      background: rgba(13, 12, 12, 0.44);
    }

    .term-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--paper);
      font-size: 15px;
      font-weight: 400;
    }

    .term-card span {
      color: var(--dim);
      font-size: 13px;
      line-height: 1.55;
    }

    .practice {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .question {
      margin: 0 0 16px;
      color: var(--paper);
      font-size: 19px;
      line-height: 1.6;
    }

    .answers {
      display: grid;
      gap: 9px;
    }

    .answer-button {
      min-height: 48px;
      padding: 12px 13px;
      font-size: 14px;
      line-height: 1.45;
    }

    .answer-button.is-correct {
      border-color: rgba(96, 118, 95, 0.84);
      background: rgba(96, 118, 95, 0.22);
    }

    .answer-button.is-wrong {
      border-color: rgba(140, 38, 49, 0.84);
      background: rgba(140, 38, 49, 0.22);
    }

    .feedback {
      min-height: 52px;
      margin: 14px 0 0;
      color: var(--dim);
      font-size: 14px;
      line-height: 1.65;
    }

    .panel-section + .panel-section {
      margin-top: 20px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .agent-study {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .agent-study img {
      width: 54px;
      height: 62px;
      object-fit: contain;
      opacity: 0.86;
    }

    .difficulty {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-button {
      min-height: 38px;
      text-align: center;
    }

    .meter {
      display: grid;
      gap: 9px;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr) 34px;
      gap: 8px;
      align-items: center;
      color: var(--dim);
      font-size: 12px;
    }

    .meter-bar {
      height: 7px;
      overflow: hidden;
      border: 1px solid rgba(242, 240, 235, 0.13);
      background: rgba(13, 12, 12, 0.54);
    }

    .meter-fill {
      display: block;
      width: var(--value);
      height: 100%;
      background: linear-gradient(90deg, var(--blood), var(--gold));
    }

    .action-button {
      min-height: 40px;
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
    }

    .secondary-action {
      margin-top: 8px;
      color: var(--dim);
      background: rgba(13, 12, 12, 0.56);
    }

    .note {
      margin: 10px 0 0;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .study-shell {
        grid-template-columns: 1fr;
      }

      .rail,
      .control-panel {
        position: relative;
        top: auto;
      }

      .subject-list,
      .topic-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      main {
        padding: 18px 12px 30px;
      }

      .top {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .subject-list,
      .topic-list,
      .term-grid {
        grid-template-columns: 1fr;
      }

      .workspace {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="top">
      <div>
        <h1>Study</h1>
        <p class="subtitle">法律、JLPT N1、英语放在同一个学习台里。难度会改变解释密度、题目形式和提示强度；第一版用浏览器本地记录进度。</p>
      </div>
      <a class="back" href="/">Back</a>
    </header>

    <section class="study-shell" aria-label="Study component">
      <aside class="rail" aria-label="Subjects">
        <p class="rail-title">Subjects</p>
        <ul class="subject-list" id="subjectList"></ul>

        <div class="panel-section">
          <p class="rail-title">Topics</p>
          <ul class="topic-list" id="topicList"></ul>
        </div>
      </aside>

      <article class="workspace" aria-live="polite">
        <nav class="path" id="path"></nav>
        <p class="lesson-kicker" id="lessonKicker"></p>
        <h2 class="lesson-title" id="lessonTitle"></h2>
        <p class="lesson-copy" id="lessonCopy"></p>
        <div class="term-grid" id="termGrid"></div>

        <section class="practice" aria-label="Practice">
          <p class="section-label">Practice</p>
          <p class="question" id="question"></p>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback"></p>
        </section>
      </article>

      <aside class="control-panel" aria-label="Controls">
        <section class="panel-section agent-study">
          <img src="/assets/nun-agent/nun-agent-reading.gif" alt="Nun Agent reading">
          <p class="note">????????????????????????</p>
        </section>

        <section class="panel-section">
          <p class="panel-title">Difficulty</p>
          <div class="difficulty" id="difficultyList"></div>
          <p class="note" id="difficultyNote"></p>
        </section>

        <section class="panel-section">
          <p class="panel-title">Mode</p>
          <ul class="mode-list" id="modeList"></ul>
        </section>

        <section class="panel-section">
          <p class="panel-title">Progress</p>
          <div class="meter" id="progressMeter"></div>
          <p class="note" id="wrongNote"></p>
        </section>

        <section class="panel-section">
          <button class="action-button" type="button" id="nextButton">Next card</button>
          <button class="action-button secondary-action" type="button" id="clearWrongButton">Clear wrongs</button>
          <p class="note">????????????????????????</p>
        </section>
      </aside>
    </section>
  </main>

    <script src="/assets/study-data.js"></script>
  <script>
    const { difficulties, modes, subjects } = window.studyData;
    const progressKey = "ame-study-progress";
    const wrongKey = "ame-study-wrongs";

    function initializeQuestionIds() {
      subjects.forEach((subject) => {
        subject.topics.forEach((topic) => {
          topic.questions.forEach((item, index) => {
            item.id = item.id || `${topic.id}-${index + 1}`;
          });
        });
      });
    }

    initializeQuestionIds();

    const state = {
      subject: "law",
      topic: "criminal",
      difficulty: "standard",
      mode: "card",
      questionIndex: 0,
      progress: JSON.parse(localStorage.getItem(progressKey) || "{}"),
      wrongs: JSON.parse(localStorage.getItem(wrongKey) || "{}")
    };

    const subjectList = document.getElementById("subjectList");
    const topicList = document.getElementById("topicList");
    const difficultyList = document.getElementById("difficultyList");
    const difficultyNote = document.getElementById("difficultyNote");
    const modeList = document.getElementById("modeList");
    const path = document.getElementById("path");
    const lessonKicker = document.getElementById("lessonKicker");
    const lessonTitle = document.getElementById("lessonTitle");
    const lessonCopy = document.getElementById("lessonCopy");
    const termGrid = document.getElementById("termGrid");
    const question = document.getElementById("question");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const progressMeter = document.getElementById("progressMeter");
    const wrongNote = document.getElementById("wrongNote");
    const nextButton = document.getElementById("nextButton");
    const clearWrongButton = document.getElementById("clearWrongButton");

    function getSubject() {
      return subjects.find((subject) => subject.id === state.subject) || subjects[0];
    }

    function getTopic() {
      const subject = getSubject();
      return subject.topics.find((topic) => topic.id === state.topic) || subject.topics[0];
    }

    function getQuestionKey(topic, item) {
      return `${topic.id}:${item.id}`;
    }

    function getQuestionPool(topic) {
      if (state.mode !== "review") return topic.questions;

      const wrongPool = topic.questions.filter((item) => state.wrongs[getQuestionKey(topic, item)]);
      return wrongPool.length ? wrongPool : topic.questions;
    }

    function getActiveQuestion(topic = getTopic()) {
      const pool = getQuestionPool(topic);
      return pool[state.questionIndex % pool.length];
    }

    function saveProgress(topicId, delta = 12) {
      const current = state.progress[topicId] || 0;
      state.progress[topicId] = Math.min(100, current + delta);
      localStorage.setItem(progressKey, JSON.stringify(state.progress));
    }

    function saveWrongs() {
      localStorage.setItem(wrongKey, JSON.stringify(state.wrongs));
    }

    function recordAnswer(topic, item, correct) {
      const key = getQuestionKey(topic, item);

      if (correct) {
        delete state.wrongs[key];
      } else {
        const current = state.wrongs[key] || { misses: 0 };
        state.wrongs[key] = {
          misses: current.misses + 1,
          subject: getSubject().title,
          topic: topic.title,
          prompt: item.prompt
        };
      }

      saveWrongs();
    }

    function getWrongCountForTopic(topic = getTopic()) {
      return topic.questions.filter((item) => state.wrongs[getQuestionKey(topic, item)]).length;
    }

    function getTotalWrongCount() {
      return Object.keys(state.wrongs).length;
    }

    function renderSubjects() {
      subjectList.innerHTML = subjects.map((subject) => `
        <li>
          <button class="subject-button ${subject.id === state.subject ? "is-active" : ""}" type="button" data-subject="${subject.id}">
            ${subject.title}
            <span>${subject.subtitle}</span>
          </button>
        </li>
      `).join("");
    }

    function renderTopics() {
      const subject = getSubject();
      topicList.innerHTML = subject.topics.map((topic) => `
        <li>
          <button class="topic-button ${topic.id === state.topic ? "is-active" : ""}" type="button" data-topic="${topic.id}">
            ${topic.title}
            <span>${topic.label}</span>
          </button>
        </li>
      `).join("");
    }

    function renderDifficulty() {
      difficultyList.innerHTML = Object.entries(difficulties).map(([id, item]) => `
        <button class="mode-button ${id === state.difficulty ? "is-active" : ""}" type="button" data-difficulty="${id}">${item.label}</button>
      `).join("");
      difficultyNote.textContent = difficulties[state.difficulty].note;
    }

    function renderModes() {
      modeList.innerHTML = modes.map((mode) => `
        <li>
          <button class="mode-button ${mode.id === state.mode ? "is-active" : ""}" type="button" data-mode="${mode.id}">${mode.label}</button>
        </li>
      `).join("");
    }

    function renderLesson() {
      const subject = getSubject();
      const topic = getTopic();
      const difficulty = difficulties[state.difficulty];
      const activeMode = modes.find((mode) => mode.id === state.mode);
      const questionPool = getQuestionPool(topic);
      const activeQuestion = questionPool[state.questionIndex % questionPool.length];
      const wrongCount = getWrongCountForTopic(topic);

      path.innerHTML = `
        <span>${subject.title}</span>
        <span>${topic.title}</span>
        <span>${difficulty.label}</span>
        <span>${activeMode.label}</span>
      `;
      lessonKicker.textContent = topic.label;
      lessonTitle.textContent = topic.title;
      lessonCopy.textContent = topic.copy[difficulty.copyKey];
      termGrid.innerHTML = topic.terms.map(([term, description]) => `
        <div class="term-card">
          <strong>${term}</strong>
          <span>${description}</span>
        </div>
      `).join("");

      question.textContent = activeQuestion.prompt;
      answers.innerHTML = activeQuestion.answers.map((answer, index) => `
        <button class="answer-button" type="button" data-answer="${index}">${answer}</button>
      `).join("");
      feedback.textContent = state.mode === "review"
        ? wrongCount
          ? `?????????? ${wrongCount} ???????????`
          : "???????????????????????"
        : "";
    }

    function renderProgress() {
      progressMeter.innerHTML = subjects.map((subject) => {
        const values = subject.topics.map((topic) => state.progress[topic.id] || 0);
        const average = Math.round(values.reduce((sum, value) => sum + value, 0) / values.length);
        return `
          <div class="meter-row">
            <span>${subject.title}</span>
            <span class="meter-bar"><span class="meter-fill" style="--value:${average}%"></span></span>
            <span>${average}%</span>
          </div>
        `;
      }).join("");
      wrongNote.textContent = `错题本：${getTotalWrongCount()} 道。当前主题：${getWrongCountForTopic()} 道。`;
    }

    function renderAll() {
      renderSubjects();
      renderTopics();
      renderDifficulty();
      renderModes();
      renderLesson();
      renderProgress();
    }

    subjectList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-subject]");
      if (!button) return;
      state.subject = button.dataset.subject;
      state.topic = getSubject().topics[0].id;
      state.questionIndex = 0;
      renderAll();
    });

    topicList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-topic]");
      if (!button) return;
      state.topic = button.dataset.topic;
      state.questionIndex = 0;
      renderAll();
    });

    difficultyList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-difficulty]");
      if (!button) return;
      state.difficulty = button.dataset.difficulty;
      renderAll();
    });

    modeList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-mode]");
      if (!button) return;
      state.mode = button.dataset.mode;
      renderAll();
    });

    answers.addEventListener("click", (event) => {
      const button = event.target.closest("[data-answer]");
      if (!button) return;
      const topic = getTopic();
      const activeQuestion = getActiveQuestion(topic);
      const selected = Number(button.dataset.answer);
      const correct = selected === activeQuestion.correct;

      answers.querySelectorAll(".answer-button").forEach((answerButton) => {
        const index = Number(answerButton.dataset.answer);
        answerButton.classList.toggle("is-correct", index === activeQuestion.correct);
        answerButton.classList.toggle("is-wrong", index === selected && !correct);
      });

      feedback.textContent = `${correct ? "???" : "?????"}${activeQuestion.explain}`;
      recordAnswer(topic, activeQuestion, correct);
      saveProgress(topic.id, correct ? 14 : 6);
      renderProgress();
    });

    nextButton.addEventListener("click", () => {
      const topic = getTopic();
      state.questionIndex = (state.questionIndex + 1) % getQuestionPool(topic).length;
      renderLesson();
    });

    clearWrongButton.addEventListener("click", () => {
      state.wrongs = {};
      saveWrongs();
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
