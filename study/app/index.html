<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>Study - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (sessionStorage.getItem("ame-study-unlocked") !== "true") {
      window.location.replace("/study/");
    }
  </script>
  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #948d83;
      --line: rgba(242, 240, 235, 0.16);
      --blood: #64181f;
      --wine: #8c2631;
      --gold: #a0834d;
      --green: #60765f;
      --blue: #647f8a;
      --panel: rgba(14, 13, 13, 0.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(8, 7, 7, 0.84), rgba(8, 7, 7, 0.94)),
        url("/assets/fussli-fragments-bg.png") center / cover fixed,
        #080707;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", serif;
    }

    button { cursor: pointer; font: inherit; }

    main {
      width: min(100%, 1240px);
      margin: 0 auto;
      padding: clamp(22px, 4vw, 54px);
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 112px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 0;
      max-width: 680px;
      color: var(--dim);
      font-size: 15px;
      line-height: 1.75;
    }

    .back {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
      transition: color 180ms ease, border-color 180ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--paper);
      border-color: var(--paper);
    }

    .study-shell {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 286px;
      gap: 18px;
      align-items: start;
    }

    .rail,
    .workspace,
    .control-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .rail,
    .control-panel {
      position: sticky;
      top: 22px;
      padding: 14px;
    }

    .rail-title,
    .panel-title,
    .section-label {
      margin: 0 0 10px;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .subject-list,
    .topic-list,
    .mode-list,
    .difficulty-list,
    .answer-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .subject-button,
    .topic-button,
    .mode-button,
    .difficulty-button,
    .answer-button,
    .action-button {
      width: 100%;
      border: 1px solid rgba(242, 240, 235, 0.14);
      background: rgba(13, 12, 12, 0.56);
      color: var(--paper);
      text-align: left;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .subject-button,
    .topic-button,
    .mode-button,
    .difficulty-button {
      min-height: 42px;
      padding: 10px 11px;
      font-size: 13px;
      line-height: 1.25;
    }

    .subject-button:hover,
    .topic-button:hover,
    .mode-button:hover,
    .difficulty-button:hover,
    .answer-button:hover,
    .action-button:hover,
    .subject-button:focus-visible,
    .topic-button:focus-visible,
    .mode-button:focus-visible,
    .difficulty-button:focus-visible,
    .answer-button:focus-visible,
    .action-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(242, 240, 235, 0.38);
      background: rgba(100, 24, 31, 0.22);
    }

    .subject-button.is-active,
    .topic-button.is-active,
    .mode-button.is-active,
    .difficulty-button.is-active {
      border-color: rgba(160, 131, 77, 0.7);
      background: rgba(160, 131, 77, 0.16);
    }

    .subject-button span,
    .topic-button span,
    .mode-button span,
    .difficulty-button span {
      display: block;
      margin-top: 4px;
      color: var(--dim);
      font-size: 11px;
      line-height: 1.35;
    }

    .workspace {
      min-height: 650px;
      padding: clamp(18px, 3vw, 30px);
    }

    .path {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .path span {
      border: 1px solid rgba(242, 240, 235, 0.13);
      padding: 6px 8px;
      color: var(--dim);
      font-size: 12px;
      background: rgba(13, 12, 12, 0.44);
    }

    .lesson-title {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: 0;
    }

    .lesson-kicker {
      margin: 12px 0 0;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .lesson-copy {
      margin: 22px 0 0;
      color: rgba(242, 240, 235, 0.88);
      font-size: clamp(16px, 1.8vw, 20px);
      line-height: 1.85;
    }

    .term-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .term-card {
      min-height: 88px;
      border: 1px solid rgba(242, 240, 235, 0.13);
      padding: 13px;
      background: rgba(13, 12, 12, 0.44);
    }

    .term-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--paper);
      font-size: 15px;
      font-weight: 400;
    }

    .term-card span {
      color: var(--dim);
      font-size: 13px;
      line-height: 1.55;
    }

    .practice {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--dim);
      font-size: 12px;
    }

    .question {
      margin: 0 0 16px;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.55;
    }

    .answer-button {
      min-height: 48px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.45;
    }

    .answer-button.is-correct {
      border-color: rgba(96, 118, 95, 0.85);
      background: rgba(96, 118, 95, 0.24);
    }

    .answer-button.is-wrong {
      border-color: rgba(140, 38, 49, 0.9);
      background: rgba(140, 38, 49, 0.24);
    }

    .feedback {
      min-height: 74px;
      margin-top: 14px;
      color: rgba(242, 240, 235, 0.88);
      font-size: 14px;
      line-height: 1.7;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .action-button {
      min-height: 40px;
      padding: 9px 10px;
      text-align: center;
      font-size: 13px;
    }

    .panel-section + .panel-section {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .meter {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(242, 240, 235, 0.13);
      background: rgba(13, 12, 12, 0.48);
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blood), var(--gold));
      transition: width 220ms ease;
    }

    .stat {
      margin: 8px 0 0;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
    }

    .empty {
      border: 1px solid rgba(242, 240, 235, 0.13);
      padding: 14px;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.65;
      background: rgba(13, 12, 12, 0.44);
    }

    @media (max-width: 980px) {
      .study-shell {
        grid-template-columns: 1fr;
      }

      .rail,
      .control-panel {
        position: static;
      }

      .subject-list,
      .topic-list,
      .mode-list,
      .difficulty-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .top {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .term-grid,
      .subject-list,
      .topic-list,
      .mode-list,
      .difficulty-list,
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>Study</h1>
        <p class="subtitle">法律、日语、经济。面向在日本的中国留学生，但学习内容按考试复习组织。</p>
      </div>
      <a class="back" href="/">Back</a>
    </header>

    <section class="study-shell" aria-label="Study module">
      <aside class="rail">
        <p class="rail-title">Subjects</p>
        <ul class="subject-list" id="subjectList"></ul>
        <div class="panel-section">
          <p class="rail-title">Topics</p>
          <ul class="topic-list" id="topicList"></ul>
        </div>
      </aside>

      <section class="workspace">
        <nav class="path" id="path"></nav>
        <h2 class="lesson-title" id="lessonTitle"></h2>
        <p class="lesson-kicker" id="lessonKicker"></p>
        <p class="lesson-copy" id="lessonCopy"></p>
        <div class="term-grid" id="termGrid"></div>

        <section class="practice" aria-label="Practice">
          <div class="question-meta" id="questionMeta"></div>
          <p class="question" id="questionText"></p>
          <div class="answer-list" id="answerList"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="actions">
            <button class="action-button" type="button" id="hintButton">提示</button>
            <button class="action-button" type="button" id="nextButton">下一题</button>
          </div>
        </section>
      </section>

      <aside class="control-panel">
        <section class="panel-section">
          <p class="panel-title">Mode</p>
          <ul class="mode-list" id="modeList"></ul>
        </section>

        <section class="panel-section">
          <p class="panel-title">Difficulty</p>
          <ul class="difficulty-list" id="difficultyList"></ul>
        </section>

        <section class="panel-section">
          <p class="panel-title">Progress</p>
          <div class="meter"><span id="progressBar"></span></div>
          <p class="stat" id="progressText"></p>
          <p class="stat" id="wrongNote"></p>
          <button class="action-button" type="button" id="clearWrongsButton">清空错题本</button>
        </section>
      </aside>
    </section>
  </main>

  <script src="/assets/study-data.js"></script>
  <script>
    const data = window.studyData;
    const progressKey = "ame-study-progress";
    const wrongKey = "ame-study-wrongs";
    const state = {
      subjectId: data.subjects[0].id,
      topicId: data.subjects[0].topics[0].id,
      modeId: "card",
      difficultyId: "standard",
      questionIndex: 0,
      answered: false
    };

    const els = {
      subjectList: document.getElementById("subjectList"),
      topicList: document.getElementById("topicList"),
      modeList: document.getElementById("modeList"),
      difficultyList: document.getElementById("difficultyList"),
      path: document.getElementById("path"),
      lessonTitle: document.getElementById("lessonTitle"),
      lessonKicker: document.getElementById("lessonKicker"),
      lessonCopy: document.getElementById("lessonCopy"),
      termGrid: document.getElementById("termGrid"),
      questionMeta: document.getElementById("questionMeta"),
      questionText: document.getElementById("questionText"),
      answerList: document.getElementById("answerList"),
      feedback: document.getElementById("feedback"),
      hintButton: document.getElementById("hintButton"),
      nextButton: document.getElementById("nextButton"),
      progressBar: document.getElementById("progressBar"),
      progressText: document.getElementById("progressText"),
      wrongNote: document.getElementById("wrongNote"),
      clearWrongsButton: document.getElementById("clearWrongsButton")
    };

    function loadJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) || fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getSubject() {
      return data.subjects.find((subject) => subject.id === state.subjectId) || data.subjects[0];
    }

    function getTopic() {
      const subject = getSubject();
      return subject.topics.find((topic) => topic.id === state.topicId) || subject.topics[0];
    }

    function allQuestions() {
      return data.subjects.flatMap((subject) =>
        subject.topics.flatMap((topic) =>
          topic.questions.map((question) => ({ subject, topic, question }))
        )
      );
    }

    function getWrongs() {
      return loadJson(wrongKey, {});
    }

    function setWrongs(wrongs) {
      saveJson(wrongKey, wrongs);
    }

    function getProgress() {
      return loadJson(progressKey, {});
    }

    function setProgress(progress) {
      saveJson(progressKey, progress);
    }

    function getQuestionPool() {
      const topic = getTopic();
      if (state.modeId !== "review") return topic.questions;

      const wrongs = getWrongs();
      const wrongIds = new Set(Object.keys(wrongs));
      const topicWrongs = topic.questions.filter((question) => wrongIds.has(question.id));
      return topicWrongs.length ? topicWrongs : topic.questions;
    }

    function currentQuestion() {
      const pool = getQuestionPool();
      return pool[state.questionIndex % pool.length];
    }

    function renderButtonList(container, items, activeId, className, onClick) {
      container.innerHTML = items.map((item) => {
        const note = item.subtitle || item.note || item.label || "";
        return `
          <li>
            <button class="${className}${item.id === activeId ? " is-active" : ""}" type="button" data-id="${item.id}">
              ${item.title || item.label}
              ${note && note !== (item.title || item.label) ? `<span>${note}</span>` : ""}
            </button>
          </li>`;
      }).join("");

      container.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => onClick(button.dataset.id));
      });
    }

    function renderNav() {
      const subject = getSubject();
      renderButtonList(els.subjectList, data.subjects, state.subjectId, "subject-button", (id) => {
        state.subjectId = id;
        state.topicId = getSubject().topics[0].id;
        state.questionIndex = 0;
        state.answered = false;
        render();
      });

      renderButtonList(els.topicList, subject.topics, state.topicId, "topic-button", (id) => {
        state.topicId = id;
        state.questionIndex = 0;
        state.answered = false;
        render();
      });

      renderButtonList(els.modeList, data.modes, state.modeId, "mode-button", (id) => {
        state.modeId = id;
        state.questionIndex = 0;
        state.answered = false;
        render();
      });

      const difficultyItems = Object.entries(data.difficulties).map(([id, value]) => ({ id, ...value }));
      renderButtonList(els.difficultyList, difficultyItems, state.difficultyId, "difficulty-button", (id) => {
        state.difficultyId = id;
        render();
      });
    }

    function renderLesson() {
      const subject = getSubject();
      const topic = getTopic();
      const difficulty = data.difficulties[state.difficultyId];
      els.path.innerHTML = [`${subject.title}`, `${topic.title}`, `${difficulty.label}`].map((item) => `<span>${item}</span>`).join("");
      els.lessonTitle.textContent = topic.title;
      els.lessonKicker.textContent = topic.label;
      els.lessonCopy.textContent = topic.copy[difficulty.copyKey] || topic.copy.standard;
      els.termGrid.innerHTML = topic.terms.map(([term, note]) => `
        <article class="term-card">
          <strong>${term}</strong>
          <span>${note}</span>
        </article>
      `).join("");
    }

    function renderQuestion() {
      const topic = getTopic();
      const pool = getQuestionPool();
      const question = currentQuestion();
      const progress = getProgress();
      const topicDone = topic.questions.filter((item) => progress[item.id]?.correct).length;
      const wrongs = getWrongs();
      const wrongCount = Object.keys(wrongs).length;
      const topicWrongCount = topic.questions.filter((item) => wrongs[item.id]).length;

      els.questionMeta.innerHTML = [
        `题目 ${state.questionIndex % pool.length + 1} / ${pool.length}`,
        `本主题 ${topicDone} / ${topic.questions.length}`,
        state.modeId === "review" && topicWrongCount === 0 ? "本主题暂无错题，显示普通题库" : ""
      ].filter(Boolean).map((item) => `<span>${item}</span>`).join("");

      els.questionText.textContent = question.prompt;
      els.answerList.innerHTML = question.answers.map((answer, index) => `
        <button class="answer-button" type="button" data-index="${index}">${answer}</button>
      `).join("");
      els.feedback.textContent = state.modeId === "card" ? "先看知识卡片，再用题目确认自己是否真的能判断。" : "";
      els.answerList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => answerQuestion(Number(button.dataset.index)));
      });

      const percent = topic.questions.length ? Math.round((topicDone / topic.questions.length) * 100) : 0;
      els.progressBar.style.width = `${percent}%`;
      els.progressText.textContent = `当前主题正确完成 ${topicDone}/${topic.questions.length}。`;
      els.wrongNote.textContent = `错题本 ${wrongCount} 题；当前主题 ${topicWrongCount} 题。`;
    }

    function answerQuestion(index) {
      if (state.answered) return;
      state.answered = true;
      const subject = getSubject();
      const topic = getTopic();
      const question = currentQuestion();
      const isCorrect = index === question.correct;
      const progress = getProgress();
      const wrongs = getWrongs();

      progress[question.id] = {
        correct: isCorrect,
        attempts: (progress[question.id]?.attempts || 0) + 1,
        updatedAt: new Date().toISOString()
      };

      if (isCorrect) {
        delete wrongs[question.id];
      } else {
        wrongs[question.id] = {
          subject: subject.title,
          topic: topic.title,
          prompt: question.prompt,
          misses: (wrongs[question.id]?.misses || 0) + 1,
          updatedAt: new Date().toISOString()
        };
      }

      setProgress(progress);
      setWrongs(wrongs);

      els.answerList.querySelectorAll("button").forEach((button) => {
        const buttonIndex = Number(button.dataset.index);
        if (buttonIndex === question.correct) button.classList.add("is-correct");
        if (buttonIndex === index && !isCorrect) button.classList.add("is-wrong");
      });

      els.feedback.textContent = `${isCorrect ? "正确。" : "这一题先收进错题本。"} ${question.explain}`;
      renderQuestionStatsOnly();
    }

    function renderQuestionStatsOnly() {
      const topic = getTopic();
      const progress = getProgress();
      const wrongs = getWrongs();
      const topicDone = topic.questions.filter((item) => progress[item.id]?.correct).length;
      const wrongCount = Object.keys(wrongs).length;
      const topicWrongCount = topic.questions.filter((item) => wrongs[item.id]).length;
      const percent = topic.questions.length ? Math.round((topicDone / topic.questions.length) * 100) : 0;
      els.progressBar.style.width = `${percent}%`;
      els.progressText.textContent = `当前主题正确完成 ${topicDone}/${topic.questions.length}。`;
      els.wrongNote.textContent = `错题本 ${wrongCount} 题；当前主题 ${topicWrongCount} 题。`;
    }

    els.hintButton.addEventListener("click", () => {
      const question = currentQuestion();
      els.feedback.textContent = `提示：${question.hint}`;
    });

    els.nextButton.addEventListener("click", () => {
      const pool = getQuestionPool();
      state.questionIndex = (state.questionIndex + 1) % pool.length;
      state.answered = false;
      renderQuestion();
    });

    els.clearWrongsButton.addEventListener("click", () => {
      setWrongs({});
      state.questionIndex = 0;
      state.answered = false;
      renderQuestion();
    });

    function render() {
      renderNav();
      renderLesson();
      renderQuestion();
    }

    render();
  </script>
</body>
</html>
