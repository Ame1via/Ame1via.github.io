<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stage - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #8b8781;
      --blood: #5b1417;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 46%, rgba(91, 20, 23, 0.18), transparent 28%),
        var(--black);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .desk {
      width: min(100%, 620px);
      text-align: center;
    }

    p {
      margin: 0 0 44px;
      color: var(--paper);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", "SimSun", Georgia, serif;
      font-size: clamp(24px, 4vw, 46px);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.04em;
    }

    .note {
      margin: 0;
    }

    .defaire-link {
      position: relative;
      display: inline-block;
      color: var(--paper);
      text-decoration: none;
      text-transform: none;
      border: 0;
      font: inherit;
      letter-spacing: inherit;
      transition: color 220ms ease;
    }

    .defaire-link::before {
      content: "défaire";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      color: var(--dim);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: opacity 240ms ease, transform 240ms ease;
      pointer-events: none;
    }

    .defaire-link::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(91, 20, 23, 0.92), transparent);
      box-shadow: 0 0 18px rgba(91, 20, 23, 0.62);
      transform: translateX(-50%);
      transition: width 260ms ease, opacity 260ms ease;
      opacity: 0;
    }

    .defaire-char {
      display: inline-block;
      transition: transform 260ms ease, color 220ms ease;
    }

    .defaire-link:hover,
    .defaire-link:focus-visible {
      color: var(--paper);
    }

    .defaire-link:hover::before,
    .defaire-link:focus-visible::before {
      opacity: 0.84;
      transform: translate(-50%, 0);
    }

    .defaire-link:hover::after,
    .defaire-link:focus-visible::after {
      width: 112%;
      opacity: 1;
    }

    .defaire-link:hover .defaire-char:first-child,
    .defaire-link:focus-visible .defaire-char:first-child {
      color: #fffaf0;
      transform: translate(-2px, -1px);
    }

    .defaire-link:hover .defaire-char:last-child,
    .defaire-link:focus-visible .defaire-char:last-child {
      color: #fffaf0;
      transform: translate(2px, 1px);
    }

    a {
      color: var(--paper);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
      transition: color 220ms ease, border-color 220ms ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--dim);
      border-color: var(--dim);
    }
  </style>
</head>

<body>
  <main>
    <div class="desk">
      <div class="note">
        <p>我们来<a class="defaire-link" href="/room/nun-agent/" aria-label="Enter Cell"><span class="defaire-char">解</span><span class="defaire-char">构</span></a>这一切吧</p>
      </div>
      <a href="/">Back</a>
    </div>
  </main>
</body>
</html>
