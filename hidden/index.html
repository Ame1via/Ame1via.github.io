<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stage - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #8b8781;
      --blood: #5b1417;
      --amber: #a0834d;
      --mx: 50%;
      --my: 46%;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--black);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(91, 20, 23, 0.22), transparent 28%),
        radial-gradient(circle at 18% 18%, rgba(160, 131, 77, 0.08), transparent 24%),
        radial-gradient(circle at 78% 72%, rgba(91, 20, 23, 0.14), transparent 28%),
        var(--black);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    .stage-field,
    .stage-field::before,
    .stage-field::after,
    .stage-grid,
    .stage-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .stage-field {
      z-index: 0;
      overflow: hidden;
      opacity: 0.82;
      mix-blend-mode: screen;
    }

    .stage-field::before,
    .stage-field::after {
      content: "";
      width: 62vmax;
      height: 62vmax;
      border-radius: 50%;
      filter: blur(48px);
      opacity: 0.22;
      animation: spectralDrift 28s ease-in-out infinite alternate;
    }

    .stage-field::before {
      left: -22vmax;
      top: -18vmax;
      background:
        radial-gradient(circle at 44% 50%, rgba(160, 131, 77, 0.62), transparent 38%),
        radial-gradient(circle at 62% 58%, rgba(91, 20, 23, 0.66), transparent 44%);
    }

    .stage-field::after {
      right: -24vmax;
      bottom: -22vmax;
      background:
        radial-gradient(circle at 42% 46%, rgba(102, 125, 137, 0.32), transparent 36%),
        radial-gradient(circle at 58% 54%, rgba(91, 20, 23, 0.7), transparent 46%);
      animation-delay: -9s;
    }

    .stage-grid {
      z-index: 1;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(242, 240, 235, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 240, 235, 0.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
    }

    .stage-vignette {
      z-index: 2;
      background:
        radial-gradient(circle at 50% 48%, transparent 28%, rgba(13, 12, 12, 0.56) 78%),
        linear-gradient(180deg, rgba(13, 12, 12, 0.66), transparent 34%, rgba(13, 12, 12, 0.8));
    }

    main {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .stage {
      position: relative;
      width: min(100%, 760px);
      text-align: center;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      left: 50%;
      width: min(82vw, 620px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(242, 240, 235, 0.18), rgba(91, 20, 23, 0.44), transparent);
      transform: translateX(-50%);
      opacity: 0.74;
    }

    .stage::before {
      top: -48px;
    }

    .stage::after {
      bottom: -48px;
    }

    .stage-kicker,
    .stage-index {
      position: fixed;
      z-index: 4;
      color: rgba(139, 135, 129, 0.78);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stage-kicker {
      left: clamp(18px, 4vw, 46px);
      top: clamp(18px, 4vw, 38px);
    }

    .stage-index {
      right: clamp(18px, 4vw, 46px);
      top: clamp(18px, 4vw, 38px);
    }

    .stage-line {
      margin: 0;
      color: var(--paper);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", "SimSun", Georgia, serif;
      font-size: clamp(26px, 5vw, 58px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.04em;
    }

    .stage-word {
      position: relative;
      display: inline-block;
      color: var(--paper);
      text-decoration: none;
      border-bottom: 1px solid rgba(91, 20, 23, 0.8);
      transition: color 220ms ease, border-color 220ms ease, transform 220ms ease;
    }

    .stage-word:hover,
    .stage-word:focus-visible {
      color: #fffaf0;
      border-color: rgba(160, 131, 77, 0.8);
      transform: translateY(-2px);
    }

    .stage-word::after {
      content: attr(data-note);
      position: absolute;
      left: 50%;
      top: calc(100% + 12px);
      color: var(--dim);
      font: 12px/1.4 Georgia, "Times New Roman", serif;
      letter-spacing: 0.08em;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: none;
    }

    .stage-word:hover::after,
    .stage-word:focus-visible::after {
      opacity: 0.9;
      transform: translate(-50%, 0);
    }

    .stage-actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 44px;
      flex-wrap: wrap;
    }

    .stage-actions a {
      color: rgba(242, 240, 235, 0.82);
      border-bottom: 1px solid rgba(91, 20, 23, 0.82);
      padding-bottom: 5px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 220ms ease, border-color 220ms ease, transform 220ms ease;
    }

    .stage-actions a:hover,
    .stage-actions a:focus-visible {
      color: var(--paper);
      border-color: rgba(160, 131, 77, 0.74);
      transform: translateY(-2px);
    }

    .stage-agent {
      position: fixed;
      right: 26px;
      bottom: 22px;
      width: 82px;
      height: 90px;
      border: 0;
      padding: 0;
      background: transparent;
      opacity: 0.72;
      cursor: pointer;
      transition: opacity 240ms ease, transform 240ms ease, filter 240ms ease;
    }

    .stage-agent:hover,
    .stage-agent:focus-visible,
    body.speaker-shift .stage-agent {
      opacity: 0.96;
      transform: translateY(-4px);
      filter: drop-shadow(0 0 18px rgba(91, 20, 23, 0.42));
    }

    .stage-agent img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 180ms ease;
    }

    .stage-agent .wave {
      opacity: 0;
    }

    .stage-agent:hover .idle,
    .stage-agent:focus-visible .idle,
    body.speaker-shift .stage-agent .idle {
      opacity: 0;
    }

    .stage-agent:hover .wave,
    .stage-agent:focus-visible .wave,
    body.speaker-shift .stage-agent .wave {
      opacity: 1;
    }

    @keyframes spectralDrift {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      to {
        transform: translate3d(7vw, 5vh, 0) rotate(18deg) scale(1.08);
      }
    }

    @media (max-width: 640px) {
      .stage-kicker,
      .stage-index {
        display: none;
      }

      .stage-line {
        font-size: clamp(27px, 8vw, 38px);
      }

      .stage-agent {
        right: 16px;
        bottom: 14px;
        width: 64px;
        height: 70px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage-field::before,
      .stage-field::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="stage-field" aria-hidden="true"></div>
  <div class="stage-grid" aria-hidden="true"></div>
  <div class="stage-vignette" aria-hidden="true"></div>
  <div class="stage-kicker" aria-hidden="true">Ame1via / stage</div>
  <div class="stage-index" aria-hidden="true">threshold 02</div>

  <main>
    <div class="stage">
      <p class="stage-line">
        我们来
        <a class="stage-word" href="/atlas/" data-note="Atlas">解构</a>
        这一切吧
      </p>
      <nav class="stage-actions" aria-label="Stage routes">
        <a href="/">Home</a>
        <a href="/blog/">Fragments</a>
        <a href="/room/nun-agent/">Cell</a>
      </nav>
    </div>

    <button class="stage-agent" type="button" aria-label="Enter Cell" onclick="location.href='/room/nun-agent/'">
      <img class="idle" src="/assets/nun-agent/nun-agent-idle.gif" alt="Nun Agent">
      <img class="wave" src="/assets/nun-agent/nun-agent-waving.gif" alt="">
    </button>
  </main>

  <script>
    const stageWord = document.querySelector(".stage-word");

    stageWord.addEventListener("mouseenter", () => document.body.classList.add("speaker-shift"));
    stageWord.addEventListener("mouseleave", () => document.body.classList.remove("speaker-shift"));
    stageWord.addEventListener("focus", () => document.body.classList.add("speaker-shift"));
    stageWord.addEventListener("blur", () => document.body.classList.remove("speaker-shift"));

    window.addEventListener("pointermove", (event) => {
      document.body.style.setProperty("--mx", `${(event.clientX / window.innerWidth) * 100}%`);
      document.body.style.setProperty("--my", `${(event.clientY / window.innerHeight) * 100}%`);
    });
  </script>
</body>
</html>
