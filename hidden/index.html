<!DOCTYPE html>
<html lang="en">
<head>
  <title>Room - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #8b8781;
      --blood: #5b1417;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 46%, rgba(91, 20, 23, 0.18), transparent 28%),
        var(--black);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .desk {
      width: min(100%, 620px);
      text-align: center;
    }

    p {
      margin: 0 0 44px;
      color: var(--paper);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", "SimSun", Georgia, serif;
      font-size: clamp(24px, 4vw, 46px);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.04em;
    }

    .note {
      margin: 0;
    }

    a {
      color: var(--paper);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
      transition: color 220ms ease, border-color 220ms ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--dim);
      border-color: var(--dim);
    }
  </style>
</head>

<body>
  <main>
    <div class="desk">
      <div class="note">
        <p>我们来解构这一切吧</p>
      </div>
      <a href="/">Back</a>
    </div>
  </main>
</body>
</html>
