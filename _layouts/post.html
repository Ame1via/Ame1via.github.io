<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #9a958b;
      --blood: {{ page.accent | default: "#5b1417" }};
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(13, 12, 12, 0.66), rgba(13, 12, 12, 0.88)),
        linear-gradient(180deg, rgba(13, 12, 12, 0.30), rgba(13, 12, 12, 0.96)),
        url("/assets/fussli-fragments-bg.png") center / cover fixed;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    .post-room {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 72px clamp(24px, 9vw, 128px);
    }

    .post-fragment {
      width: min(100%, 680px);
      line-height: 1.85;
    }

    .post-fragment time {
      display: block;
      margin-bottom: 26px;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.10em;
    }

    .post-fragment h1 {
      margin: 0 0 34px;
      font-size: clamp(34px, 5vw, 64px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .post-fragment p {
      margin: 0 0 24px;
      font-size: clamp(18px, 2vw, 24px);
    }

    .post-fragment blockquote {
      margin: 0 0 28px;
      padding: 0 0 0 18px;
      border-left: 1px solid var(--blood);
      color: var(--paper);
      font-size: clamp(20px, 2.4vw, 28px);
    }

    .post-fragment pre {
      margin: 30px 0 34px;
      padding: 24px clamp(18px, 3vw, 32px);
      overflow-x: auto;
      border-left: 1px solid color-mix(in srgb, var(--blood), transparent 18%);
      background: rgba(13, 12, 12, 0.64);
      color: var(--paper);
      font-size: clamp(15px, 1.7vw, 20px);
      line-height: 1.7;
    }

    .post-fragment code {
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    }

    .post-back {
      display: inline-block;
      margin-top: 28px;
      color: var(--dim);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 220ms ease, text-shadow 260ms ease;
    }

    .post-back:hover,
    .post-back:focus-visible {
      color: var(--paper);
    }

    body.read-complete .post-back {
      color: var(--paper);
      text-shadow: 0 0 18px color-mix(in srgb, var(--blood), transparent 24%);
    }

    .agent-widget {
      position: fixed;
      right: 26px;
      bottom: 22px;
      width: 82px;
      height: 90px;
      margin: 0;
      opacity: 0.62;
      transition: opacity 240ms ease, transform 240ms ease;
    }

    .agent-widget:hover,
    .agent-widget:focus-within {
      opacity: 0.96;
      transform: translateY(-4px);
    }

    .agent-widget img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 180ms ease;
    }

    .agent-widget .wave {
      opacity: 0;
    }

    .agent-widget .run-left,
    .agent-widget .run-right {
      opacity: 0;
    }

    .agent-widget.is-waving .idle,
    .agent-widget:hover .idle,
    .agent-widget:focus-within .idle {
      opacity: 0;
    }

    .agent-widget.is-waving .wave,
    .agent-widget:hover .wave,
    .agent-widget:focus-within .wave {
      opacity: 1;
    }

    .agent-widget.agent-patrol-left {
      animation: patrol-left 8.2s linear both;
    }

    .agent-widget.agent-patrol-right {
      animation: patrol-right 8.2s linear both;
    }

    .agent-widget.agent-patrol-left .idle,
    .agent-widget.agent-patrol-right .idle,
    .agent-widget.agent-patrol-left .wave,
    .agent-widget.agent-patrol-right .wave {
      opacity: 0;
    }

    .agent-widget.agent-patrol-left .run-left,
    .agent-widget.agent-patrol-right .run-right {
      opacity: 1;
    }

    @keyframes patrol-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-100vw + 132px)); }
    }

    @keyframes patrol-right {
      0% { transform: translateX(calc(-100vw + 132px)); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 640px) {
      body {
        background-attachment: scroll;
      }

      .post-room {
        align-items: flex-start;
        padding-top: 88px;
      }

      .agent-widget {
        right: 16px;
        bottom: 14px;
        width: 64px;
        height: 70px;
      }
    }
  </style>
</head>

<body>
  <main class="post-room">
    <article class="post-fragment">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      <h1>{{ page.title }}</h1>
      {{ content }}
      <span class="read-end" aria-hidden="true"></span>
      <a class="post-back" href="{{ '/blog/' | relative_url }}">Back</a>
    </article>
  </main>

  <figure class="agent-widget" aria-label="Nun Agent">
    <img class="idle" src="/assets/nun-agent/nun-agent-idle.gif" alt="Nun Agent">
    <img class="wave" src="/assets/nun-agent/nun-agent-waving.gif" alt="">
    <img class="run-left" src="/assets/nun-agent/nun-agent-running-left.gif" alt="">
    <img class="run-right" src="/assets/nun-agent/nun-agent-running-right.gif" alt="">
  </figure>
  <script src="/assets/site-interactions.js"></script>
</body>
</html>
