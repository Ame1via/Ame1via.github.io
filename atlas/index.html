<!DOCTYPE html>
<html lang="en">
<head>
  <title>Atlas - Ame1via</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --black: #0d0c0c;
      --paper: #f2f0eb;
      --dim: #8b8781;
      --blood: #5b1417;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 48%, rgba(91, 20, 23, 0.14), transparent 32%),
        var(--black);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .atlas {
      width: min(100%, 760px);
      text-align: center;
    }

    h1 {
      margin: 0 0 38px;
      font-size: clamp(40px, 7vw, 86px);
      font-weight: 400;
      letter-spacing: 0;
    }

    .branches {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(14px, 4vw, 42px);
      margin: 0 0 52px;
      padding: 0;
      list-style: none;
    }

    .branches li {
      position: relative;
      padding-top: 36px;
      color: var(--dim);
      font-size: clamp(14px, 2vw, 20px);
      letter-spacing: 0.08em;
    }

    .branches li::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 26px;
      background: linear-gradient(180deg, rgba(91, 20, 23, 0.82), transparent);
    }

    .branches li::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 26px;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(242, 240, 235, 0.28);
      border-radius: 50%;
      background: rgba(13, 12, 12, 0.72);
      transform: translateX(-50%);
    }

    .note {
      margin: 0 0 42px;
      color: var(--dim);
      font-size: 15px;
      line-height: 1.8;
    }

    a {
      color: var(--paper);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blood);
      transition: color 220ms ease, border-color 220ms ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--dim);
      border-color: var(--dim);
    }

    @media (max-width: 640px) {
      .branches {
        grid-template-columns: 1fr 1fr;
        row-gap: 32px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="atlas" aria-label="Atlas">
      <h1>Atlas</h1>
      <ul class="branches">
        <li>place</li>
        <li>time</li>
        <li>state</li>
        <li>theory</li>
      </ul>
      <p class="note">not arranged yet</p>
      <a href="/hidden/">Back</a>
    </section>
  </main>
</body>
</html>
