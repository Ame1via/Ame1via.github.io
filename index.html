<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ame1via</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --black: #0d0c0c;
            --white: #f2f0eb;
            --dim: #8b8781;
            --red: #5b1417;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--black);
            color: var(--white);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .room {
            width: min(100%, 520px);
            text-align: center;
        }

        .mark {
            margin: 0 0 44px;
            color: var(--dim);
            font-size: 28px;
            line-height: 1;
        }

        a {
            position: relative;
            display: inline-block;
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid var(--red);
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 220ms ease, border-color 220ms ease, transform 220ms ease;
        }

        a:hover {
            color: var(--dim);
            border-color: var(--dim);
            transform: translateY(-2px);
        }

        .hint {
            position: absolute;
            left: 50%;
            top: calc(100% + 18px);
            width: min(72vw, 260px);
            transform: translate(-50%, 8px);
            color: var(--dim);
            font-size: 13px;
            line-height: 1.7;
            letter-spacing: 0;
            text-transform: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 260ms ease, transform 260ms ease;
        }

        a:hover .hint,
        a:focus-visible .hint {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .agent-widget {
            position: fixed;
            right: 26px;
            bottom: 22px;
            width: 82px;
            height: 90px;
            margin: 0;
            opacity: 0.72;
            transition: opacity 240ms ease, transform 240ms ease;
        }

        .agent-widget:hover,
        .agent-widget:focus-within {
            opacity: 0.96;
            transform: translateY(-4px);
        }

        .agent-widget img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 180ms ease;
        }

        .agent-widget .wave {
            opacity: 0;
        }

        .agent-widget:hover .idle,
        .agent-widget:focus-within .idle {
            opacity: 0;
        }

        .agent-widget:hover .wave,
        .agent-widget:focus-within .wave {
            opacity: 1;
        }

        @media (max-width: 600px) {
            main {
                padding: 24px;
            }

            .mark {
                margin-bottom: 36px;
                font-size: 24px;
            }

            .agent-widget {
                right: 16px;
                bottom: 14px;
                width: 64px;
                height: 70px;
            }
        }
    </style>
</head>

<body>
<main>
    <div class="room">
        <p class="mark">&dagger;</p>
        <a href="/blog/">
            Fragments
            <span class="hint">Short writings, kept quiet.</span>
        </a>
    </div>
</main>
<figure class="agent-widget" aria-label="Nun Agent">
    <img class="idle" src="/assets/nun-agent/nun-agent-idle.gif" alt="Nun Agent">
    <img class="wave" src="/assets/nun-agent/nun-agent-waving.gif" alt="">
</figure>
</body>
</html>
