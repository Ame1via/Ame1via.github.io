<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ame1via</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --black: #0d0c0c;
            --white: #f2f0eb;
            --dim: #8b8781;
            --red: #5b1417;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--black);
            color: var(--white);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .room {
            width: min(100%, 520px);
            text-align: center;
        }

        .mark {
            margin: 0 0 44px;
            color: var(--dim);
            font-size: 28px;
            line-height: 1;
        }

        a {
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid var(--red);
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        a:hover {
            color: var(--dim);
        }

        @media (max-width: 600px) {
            main {
                padding: 24px;
            }

            .mark {
                margin-bottom: 36px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
<main>
    <div class="room">
        <p class="mark">&dagger;</p>
        <a href="/blog/">Fragments</a>
    </div>
</main>
</body>
</html>
