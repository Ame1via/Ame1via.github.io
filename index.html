<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ame1via</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --black: #0d0c0c;
            --white: #f2f0eb;
            --dim: #8b8781;
            --red: #5b1417;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 50%, rgba(91, 20, 23, 0.12), transparent 34%),
                var(--black);
            color: var(--white);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .room {
            width: min(100%, 520px);
            text-align: center;
        }

        .mark {
            margin: 0 0 44px;
            color: var(--dim);
            font-size: 28px;
            line-height: 1;
            cursor: default;
            user-select: none;
            transition: color 220ms ease, transform 220ms ease;
        }

        .mark:hover {
            color: var(--white);
            transform: translateY(-1px);
        }

        .gate {
            position: relative;
            display: inline-block;
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid var(--red);
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 220ms ease, border-color 220ms ease, transform 220ms ease;
        }

        .gate:hover {
            color: var(--dim);
            border-color: var(--dim);
            transform: translateY(-2px);
        }

        .gate::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -7px;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(242, 240, 235, 0.82), transparent);
            box-shadow: 0 0 16px rgba(91, 20, 23, 0.92);
            transform: translateX(-50%);
            transition: width 280ms ease, opacity 280ms ease;
            opacity: 0;
        }

        .gate:hover::after,
        .gate:focus-visible::after {
            width: 150%;
            opacity: 1;
        }

        .hint {
            position: absolute;
            left: 50%;
            top: calc(100% + 18px);
            width: min(72vw, 260px);
            transform: translate(-50%, 8px);
            color: var(--dim);
            font-size: 13px;
            line-height: 1.7;
            letter-spacing: 0;
            text-transform: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 260ms ease, transform 260ms ease;
        }

        .gate:hover .hint,
        .gate:focus-visible .hint {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .agent-widget {
            position: fixed;
            right: 26px;
            bottom: 22px;
            width: 82px;
            height: 90px;
            margin: 0;
            opacity: 0.72;
            transition: opacity 240ms ease, transform 240ms ease;
        }

        main:has(.gate:hover) + .agent-widget,
        main:has(.gate:focus-visible) + .agent-widget,
        .agent-widget:hover,
        .agent-widget:focus-within {
            opacity: 0.96;
            transform: translateY(-4px);
        }

        .agent-widget img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 180ms ease;
        }

        .agent-widget .wave {
            opacity: 0;
        }

        .agent-widget .run-left,
        .agent-widget .run-right {
            opacity: 0;
        }

        body.door-open .agent-widget .idle,
        .agent-widget.is-waving .idle,
        main:has(.gate:hover) + .agent-widget .idle,
        main:has(.gate:focus-visible) + .agent-widget .idle,
        .agent-widget:hover .idle,
        .agent-widget:focus-within .idle {
            opacity: 0;
        }

        body.door-open .agent-widget .wave,
        .agent-widget.is-waving .wave,
        main:has(.gate:hover) + .agent-widget .wave,
        main:has(.gate:focus-visible) + .agent-widget .wave,
        .agent-widget:hover .wave,
        .agent-widget:focus-within .wave {
            opacity: 1;
        }

        .agent-widget.agent-patrol-left {
            animation: patrol-left 8.2s linear both;
        }

        .agent-widget.agent-patrol-right {
            animation: patrol-right 8.2s linear both;
        }

        .agent-widget.agent-patrol-left .idle,
        .agent-widget.agent-patrol-right .idle,
        .agent-widget.agent-patrol-left .wave,
        .agent-widget.agent-patrol-right .wave {
            opacity: 0;
        }

        .agent-widget.agent-patrol-left .run-left,
        .agent-widget.agent-patrol-right .run-right {
            opacity: 1;
        }

        @keyframes patrol-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-100vw + 132px)); }
        }

        @keyframes patrol-right {
            0% { transform: translateX(calc(-100vw + 132px)); }
            100% { transform: translateX(0); }
        }

        .hidden-door {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 8px);
            color: var(--dim);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-decoration: none;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(91, 20, 23, 0.72);
            opacity: 0;
            pointer-events: none;
            transition: opacity 260ms ease, transform 260ms ease, color 220ms ease;
        }

        body.door-open .hidden-door {
            opacity: 0.86;
            pointer-events: auto;
            transform: translate(-50%, 0);
        }

        .hidden-door:hover,
        .hidden-door:focus-visible {
            color: var(--white);
        }

        @media (max-width: 600px) {
            main {
                padding: 24px;
            }

            .mark {
                margin-bottom: 36px;
                font-size: 24px;
            }

            .agent-widget {
                right: 16px;
                bottom: 14px;
                width: 64px;
                height: 70px;
            }
        }
    </style>
</head>

<body>
<main>
    <div class="room">
        <p class="mark" aria-label="Hidden mark">&dagger;</p>
        <a class="gate" href="/blog/">
            Fragments
            <span class="hint">Short writings, kept quiet.</span>
        </a>
    </div>
</main>
<figure class="agent-widget" aria-label="Nun Agent">
    <img class="idle" src="/assets/nun-agent/nun-agent-idle.gif" alt="Nun Agent">
    <img class="wave" src="/assets/nun-agent/nun-agent-waving.gif" alt="">
    <img class="run-left" src="/assets/nun-agent/nun-agent-running-left.gif" alt="">
    <img class="run-right" src="/assets/nun-agent/nun-agent-running-right.gif" alt="">
</figure>
<a class="hidden-door" href="/hidden/">Room</a>
<script src="/assets/site-interactions.js"></script>
</body>
</html>
